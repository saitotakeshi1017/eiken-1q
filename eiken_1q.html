<html lang="ja">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF3E4; --ink:#1E1B16; --line:#1E1B16;
  --correct:#1F9D55; --correct-bg:#D7F2DF;
  --wrong:#E23E3E; --wrong-bg:#FBDADA;
  --shadow:6px 6px 0 var(--line);
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --disp:"Fraunces",Georgia,serif;
  --mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden;scroll-behavior:smooth}
html,body,button,input,select,.word-detail-card,.word-face,.search-result{-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none}
button,.word-detail-card,.search-result{touch-action:manipulation;-webkit-touch-callout:none}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--line) 0.6px, transparent 0.6px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--jp);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  height:100vh;min-height:100vh;overflow:hidden;
}
html.overlay-scroll-lock,body.overlay-scroll-lock{overflow:hidden}
body.overlay-scroll-lock{position:fixed;left:0;right:0;width:100%}
header{
  position:fixed; top:var(--vv-top,0px); left:0; right:0; z-index:50;
  background:var(--paper); border-bottom:3px solid var(--line);
}
.bar{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:900;font-size:1.5rem;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.18em;color:#8a7a5c;margin-top:3px}
.scorebox{margin-left:auto;display:flex;gap:8px;align-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem}
.chip{border:2.5px solid var(--line);background:#fff;padding:5px 10px;border-radius:999px;box-shadow:3px 3px 0 var(--line)}
.chip b{color:var(--accent,#F4633A)}
.iconb{width:44px;height:44px;border:2.5px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--line);cursor:pointer;font-size:1.1rem;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
.iconb:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.iconb:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--line)}
.iconb:focus,.iconb:focus-visible{outline:none}
.bookmark-btn{
  width:38px;height:38px;border:2.5px solid var(--line);border-radius:999px;
  background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--line);
  cursor:pointer;font-family:var(--mono);font-weight:900;font-size:1rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s,background .12s,color .12s;
}
.bookmark-btn.is-bookmarked{background:#FFD75E;color:var(--ink)}
.bookmark-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.bookmark-btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--line)}
.bookmark-btn:focus,.bookmark-btn:focus-visible{outline:none}
.jumpbar{max-width:1100px;margin:0 auto;padding:0 18px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jump-field{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:700;font-size:.68rem;letter-spacing:.12em;color:#8a7a5c}
.jump-field select{
  min-height:42px;font-family:var(--mono);font-weight:700;font-size:.9rem;letter-spacing:0;
  border:2.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:0 12px;box-shadow:3px 3px 0 var(--line);cursor:pointer;
}
.jump-field select:focus,.jump-field select:focus-visible,.jump-field select:active{
  outline:none;border-color:var(--line);background:#fff;box-shadow:3px 3px 0 var(--line);
}
#modeSelect{min-width:142px}
#pageSelect{min-width:260px}
.jump-summary{font-family:var(--mono);font-weight:700;font-size:.72rem;letter-spacing:.06em;color:#8a7a5c}
.search-overlay,.word-overlay{position:fixed;inset:0;z-index:200;background:rgba(251,243,228,.7);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:18px;overflow:hidden;overscroll-behavior:none}
.search-overlay[hidden],.word-overlay[hidden]{display:none}
.search-panel{max-width:920px;height:calc(100vh - 36px);margin:0 auto;background:var(--paper);border:3px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;animation:panelDrop .22s ease-out both;display:flex;flex-direction:column;position:relative;overflow:hidden}
.search-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative;z-index:2}
.search-field{flex:1;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:700;font-size:.68rem;letter-spacing:.12em;color:#8a7a5c}
.search-field input{
  width:100%;min-height:42px;font-family:var(--mono);font-weight:700;font-size:.9rem;letter-spacing:0;
  border:2.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:0 12px;box-shadow:3px 3px 0 var(--line);outline:none;
}
.search-field input:focus{box-shadow:5px 5px 0 var(--line)}
.search-panel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,rgba(251,243,228,.96));pointer-events:none;border-radius:0 0 13px 13px}
.search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));grid-auto-rows:max-content;align-content:start;align-items:start;gap:10px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 6px 82px 2px;min-height:0;flex:1;position:relative;z-index:1}
.search-results::-webkit-scrollbar{display:none}
.search-results[hidden]{display:none}
.search-result{
  text-align:left;border:2.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
  padding:10px 12px;box-shadow:3px 3px 0 var(--line);cursor:pointer;animation:resultSlide .28s ease-out both;min-height:96px;height:auto;align-self:start;
}
.search-result:hover{background:#FFF3D6;transform:translate(-1px,-1px)}
.search-word{display:block;font-family:var(--disp);font-weight:900;font-size:1.05rem;line-height:1.05;word-break:break-word}
.search-meta{display:block;font-family:var(--mono);font-weight:700;font-size:.64rem;color:#8a7a5c;margin-top:3px}
.search-meaning{display:block;font-family:var(--jp);font-size:.76rem;color:#7a6c50;margin-top:4px;line-height:1.25}
.search-empty{font-family:var(--mono);font-weight:700;color:#8a7a5c;border:2.5px dashed var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.word-stage{width:min(780px,100%);margin:0 auto;min-height:calc(100vh - 36px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.word-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.word-tools button,.word-jump{font-family:var(--mono);font-weight:700;font-size:.85rem;border:2.5px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.word-tools button:hover,.word-jump:hover{transform:translate(-1px,-1px);box-shadow:8px 8px 0 var(--line)}
.word-tools button:active,.word-jump:active{transform:translate(1px,1px);box-shadow:4px 4px 0 var(--line)}
.word-detail-card{display:block;width:100%;height:min(56vh,430px);min-height:310px;border:none;background:transparent;perspective:1200px;cursor:pointer;padding:0;text-align:left}
.word-detail-card:focus,.word-detail-card:focus-visible{outline:none}
.word-card-inner{display:block;position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.word-detail-card.flipped .word-card-inner{transform:rotateY(180deg)}
.word-face{position:absolute;inset:0;box-sizing:border-box;backface-visibility:hidden;border:3px solid var(--line);border-radius:18px;box-shadow:10px 10px 0 var(--line);background:#fff;display:flex;flex-direction:column;justify-content:center;padding:34px}
.word-face.front{background:var(--accent-soft,#fff)}
.word-face.back{background:#FFF3D6;transform:rotateY(180deg)}
.word-no{font-family:var(--mono);font-weight:700;font-size:.82rem;color:#8a7a5c;letter-spacing:.08em;margin-bottom:14px}
.word-front-text{display:block;width:100%;font-family:var(--disp);font-weight:900;font-size:clamp(2.4rem,7vw,5.2rem);line-height:.95;word-break:normal;overflow-wrap:anywhere;writing-mode:horizontal-tb}
.word-front-ipa{font-family:var(--mono);font-weight:700;color:#8a7a5c;font-size:clamp(1rem,2.4vw,1.35rem);margin-top:16px}
.word-back-label{font-family:var(--mono);font-weight:700;color:#8a7a5c;font-size:.82rem;letter-spacing:.14em;margin-bottom:18px}
.word-back-text{font-family:var(--jp);font-weight:800;font-size:clamp(1.5rem,4.4vw,3.1rem);line-height:1.25;color:var(--ink)}
.word-page-meta{font-family:var(--mono);font-weight:700;color:#8a7a5c;text-align:center}
@keyframes panelDrop{from{opacity:0;transform:translateY(-18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes resultSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.fillbox{padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.fill-input{width:100%;font-family:var(--jp);font-size:1.05rem;padding:11px 13px;border:2.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;transition:background .12s,box-shadow .12s}
.fill-input::placeholder{color:#cbb99a;font-size:.86rem}
.fill-input:focus{box-shadow:3px 3px 0 var(--line)}
.fill-input.correct{background:var(--correct-bg);border-color:var(--correct);color:#0a7d44;font-weight:700;box-shadow:3px 3px 0 var(--correct)}
.fill-input.speak-answer,.fill-input.speak-answer:hover{cursor:pointer}
.fill-input.revealed{background:#FFF3D6;border-color:var(--accent);color:var(--ink);font-weight:700;box-shadow:3px 3px 0 var(--accent)}
.fill-input.retrying{background:#FFF8D8;border-color:#D9B84F;color:var(--ink);font-weight:700;box-shadow:3px 3px 0 #D9B84F}
.fill-status{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;color:#9a8a6a;min-height:14px}
.fill-status.ok{color:var(--correct);font-weight:700}
.fill-status.shown{color:var(--accent);font-weight:700}
.fill-status.retrying{color:#9B7B12;font-weight:700}
main{
  position:fixed;left:0;right:0;
  top:calc(var(--vv-top,0px) + var(--header-h,0px));
  bottom:var(--main-bottom,74px);
  overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;
  max-width:none;margin:0;
  padding-left:max(18px,calc((100vw - 1100px)/2 + 18px));
  padding-right:max(18px,calc((100vw - 1100px)/2 + 18px));
  padding-top:22px;padding-bottom:22px;
  scroll-behavior:auto;
}
/* Extra room only while typing, so even the last card can align with the
   header. When the keyboard closes, this space eases away. */
body.fill-page main{
  padding-bottom:var(--typing-tail-space,22px);
  transition:padding-bottom var(--tail-space-transition,0s) ease;
}
body.flip-history-page main{
  padding-bottom:calc(22px + var(--footer-h,74px));
}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead .big{font-family:var(--disp);font-weight:900;font-size:2.6rem;line-height:.95;letter-spacing:-.02em}
.pagehead .tag{font-family:var(--mono);font-weight:700;font-size:.72rem;letter-spacing:.12em;background:var(--accent);color:#fff;padding:6px 12px;border:2.5px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.pagehead .sub{font-size:.9rem;color:#7a6c50}
.page-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-width:0}
.reshuffle,.reveal-answers,.completed-count{font-family:var(--mono);font-weight:700;font-size:.82rem;border:2.5px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);transition:transform .08s;white-space:normal;text-align:center;min-width:0;max-width:100%;box-sizing:border-box;overflow:hidden;line-height:1.08;display:inline-flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.reshuffle,.reveal-answers{cursor:pointer}
.completed-count{cursor:default;color:var(--ink);flex-direction:column;gap:2px}
.completed-number{color:#ff5a36;text-shadow:0 0 6px rgba(255,90,54,.58),0 0 12px rgba(255,192,67,.35);font-weight:900}
.completed-unit{color:#6f624b}
.reshuffle:hover,.reveal-answers:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--line)}
.reshuffle:active,.reveal-answers:active:not(:disabled){transform:translate(1px,1px);box-shadow:4px 4px 0 var(--line)}
.reveal-answers{background:var(--accent);color:#fff}
.reveal-answers:disabled{opacity:.58;cursor:default;transform:none;box-shadow:var(--shadow)}
.reveal-answers.button-pressing{transform:translate(1px,1px);box-shadow:4px 4px 0 var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.grid .empty{grid-column:1/-1}
.card{
  background:#fff;border:3px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.card .top{padding:12px 16px 12px;border-bottom:3px solid var(--line);background:var(--accent-soft,#fff);position:relative}
.card.has-retry .top{padding-right:110px}
.card.has-bookmark .top{padding-right:68px}
.card.has-retry.has-bookmark .top{padding-right:154px}
.card .top .bookmark-btn{position:absolute;top:12px;right:14px;z-index:2}
.fill-retry-btn,.fill-answer-btn{
  position:absolute;top:12px;width:38px;height:38px;border:2.5px solid var(--line);
  border-radius:999px;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--line);
  cursor:pointer;font-family:var(--mono);font-weight:900;font-size:1rem;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s;
}
.fill-answer-btn{right:60px}
.fill-retry-btn{right:14px}
.card.has-retry.has-bookmark .fill-answer-btn{right:106px}
.card.has-retry.has-bookmark .fill-retry-btn{right:60px}
.fill-retry-btn:hover,.fill-answer-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.fill-retry-btn:active,.fill-answer-btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--line)}
.fill-retry-btn:focus,.fill-retry-btn:focus-visible,.fill-answer-btn:focus,.fill-answer-btn:focus-visible{outline:none}
.card .qno{display:block;font-family:var(--mono);font-weight:700;font-size:.66rem;color:#9a8a6a;margin-bottom:8px;letter-spacing:.06em}
.card .word{font-family:var(--disp);font-weight:900;font-size:1.85rem;letter-spacing:-.02em;line-height:1.05;word-break:break-word}
.card .word.jp-prompt{font-family:var(--jp);font-size:1.22rem;line-height:1.35;letter-spacing:0;font-weight:800}
.card .word .speak-target,.word-front-text .speak-target,.history-word .speak-target{cursor:pointer}
.card .ipa{font-family:var(--mono);font-size:.78rem;color:#8a7a5c;margin-top:3px}
.opts{display:flex;flex-direction:column;gap:0;padding:0}
.opt{
  text-align:left;font-family:var(--jp);font-size:.98rem;color:var(--ink);
  background:#fff;border:none;border-top:2px solid #eadfca;
  padding:13px 15px 13px 44px;cursor:pointer;position:relative;transition:background .12s;
  line-height:1.35;
}
.opt:first-child{border-top:none}
.opt:hover:not(:disabled){background:#FFF3D6}
.opt .mk{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:2.5px solid var(--line);border-radius:6px;font-family:var(--mono);font-weight:700;font-size:.72rem;display:flex;align-items:center;justify-content:center;background:#fff}
.opt.correct{background:var(--correct-bg)}
.opt.correct .mk{background:var(--correct);color:#fff;border-color:var(--correct)}
.opt.wrong{background:var(--wrong-bg)}
.opt.wrong .mk{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt:disabled{cursor:default}
.empty{text-align:center;color:#9a8a6a;padding:40px;font-family:var(--mono)}
.history-card{padding:14px 16px;gap:10px;cursor:default}
.history-card:hover{background:#fff;transform:none;box-shadow:var(--shadow)}
.history-main{min-width:0}
.history-no{display:block;font-family:var(--mono);font-weight:700;font-size:.66rem;color:#9a8a6a;letter-spacing:.06em;margin-bottom:5px}
.history-word{font-family:var(--disp);font-weight:900;font-size:1.45rem;line-height:1.05;word-break:break-word}
.history-meaning{font-size:.84rem;color:#7a6c50;line-height:1.35;margin-top:5px}
.history-actions{display:flex;align-items:center;gap:8px;margin-top:auto}
.history-card .bookmark-btn{position:static;flex:0 0 38px}
.history-open{font-family:var(--mono);font-weight:700;font-size:.78rem;border:2.5px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;box-shadow:3px 3px 0 var(--line);cursor:pointer}
.history-open:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.history-open:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--line)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:var(--paper);border-top:3px solid var(--line);z-index:50}
.fbar{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.fbar .navb{font-family:var(--mono);font-weight:700;font-size:.8rem;border:2.5px solid var(--paper);background:transparent;color:var(--paper);padding:9px 16px;border-radius:10px;cursor:pointer;transition:transform .08s}
.fbar .navb:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.fbar .navb:active:not(:disabled){transform:translate(1px,1px)}
.fbar .navb:disabled{opacity:.3;cursor:default}
.fbar .meter{flex:1;height:14px;border:2.5px solid var(--paper);border-radius:999px;overflow:hidden;background:#3a342a}
.fbar .meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.fbar .pct{font-family:var(--mono);font-weight:700;font-size:.82rem;min-width:64px;text-align:right}
.iconb,.bookmark-btn,.reshuffle,.reveal-answers,.fill-retry-btn,.fill-answer-btn,.history-open,.word-tools button,.word-jump,.fbar .navb{will-change:transform;transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s cubic-bezier(.2,.8,.2,1),background .12s ease,color .12s ease}
@media(hover:none),(pointer:coarse){
  .iconb:hover,
  .bookmark-btn:hover,
  .reshuffle:hover,
  .reveal-answers:hover:not(:disabled),
  .fill-retry-btn:hover,
  .fill-answer-btn:hover,
  .history-open:hover,
  .word-tools button:hover,
  .word-jump:hover{
    transform:none;
  }
  .iconb:hover,.bookmark-btn:hover,.fill-retry-btn:hover,.fill-answer-btn:hover,.history-open:hover{box-shadow:3px 3px 0 var(--line)}
  .reshuffle:hover,.reveal-answers:hover:not(:disabled){box-shadow:var(--shadow)}
  .word-tools button:hover,.word-jump:hover{box-shadow:var(--shadow)}
  .fbar .navb:hover:not(:disabled){background:transparent;color:var(--paper);transform:none}
  .search-result:hover{background:#fff;transform:none}
  .opt:hover:not(:disabled){background:#fff}
  .iconb:active,
  .bookmark-btn:active,
  .fill-retry-btn:active,
  .fill-answer-btn:active,
  .history-open:active{
    transform:translate(1px,1px);
    box-shadow:2px 2px 0 var(--line);
  }
  .reshuffle:active,
  .reveal-answers:active:not(:disabled),
  .word-tools button:active,
  .word-jump:active{
    transform:translate(1px,1px);
    box-shadow:4px 4px 0 var(--line);
  }
  .fbar .navb:active:not(:disabled){
    transform:translate(1px,1px);
    background:rgba(251,243,228,.12);
  }
}
@media(max-width:560px){
  .bar{padding:10px 12px;gap:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .logo{font-size:1.25rem;min-width:0}
  .scorebox{margin-left:auto;justify-content:flex-end;justify-self:end}
  .jumpbar{display:grid;grid-template-columns:1fr 1fr;padding:0 12px 10px;gap:8px}
  .jump-field{align-items:stretch;flex-direction:column;gap:4px}
  .jump-field select{width:100%;min-width:0;font-size:.82rem}
  #modeSelect,#pageSelect{min-width:0}
  .jump-summary{grid-column:1/-1;font-size:.66rem}
  .search-overlay,.word-overlay{padding:10px}
  .search-panel{height:calc(100vh - 20px);padding:12px;border-radius:12px}
  .search-head{align-items:flex-end}
  .search-field{align-items:stretch;flex-direction:column;gap:4px;min-width:0}
  .search-field input{min-height:52px}
  .search-head .iconb{width:52px;height:52px;flex:0 0 52px;align-self:flex-end;margin-bottom:0}
  .search-results{grid-template-columns:1fr}
  .word-face{padding:24px}
  .word-tools button,.word-jump{flex:1}
  .pagehead .big{font-size:2rem}
  .page-actions{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
  .reveal-answers,.reshuffle,.completed-count{width:100%;min-height:58px;padding:8px 5px;font-size:.68rem}
  .card .word{font-size:1.55rem}
  .grid{grid-template-columns:1fr}
}
@media(min-width:1600px){
  .jump-field select{min-height:48px;font-size:1rem}
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function key(p){return p.type+p.idx+(p.sig?":"+p.sig:"");}

function loadNumberSet(storageKey){
  try{
    const raw = localStorage.getItem(storageKey);
    const parsed = raw ? JSON.parse(raw) : [];
    return new Set((Array.isArray(parsed) ? parsed : []).map(Number).filter(Number.isFinite));
  }catch(e){
    return new Set();
  }
}

function saveNumberSet(storageKey, set){
  try{ localStorage.setItem(storageKey, JSON.stringify(Array.from(set).sort((a,b)=>a-b))); }catch(e){}
}

function loadNumberMap(storageKey){
  try{
    const raw = localStorage.getItem(storageKey);
    const parsed = raw ? JSON.parse(raw) : {};
    if(!parsed || typeof parsed !== "object") return {};
    const cleaned = {};
    Object.keys(parsed).forEach(k=>{
      const n = Number(k);
      const v = Number(parsed[k]);
      if(Number.isFinite(n) && Number.isFinite(v) && v>0) cleaned[n] = v;
    });
    return cleaned;
  }catch(e){
    return {};
  }
}

function saveNumberMap(storageKey, map){
  try{ localStorage.setItem(storageKey, JSON.stringify(map)); }catch(e){}
}

function isBookmarkModeType(type){
  return type==="BE" || type==="BF" || type==="BR";
}

function isDynamicModeType(type){
  return isBookmarkModeType(type) || type==="V";
}

function bookmarkedItems(){
  return DATA.filter(d=>bookmarkIds.has(d.n));
}

function flipViewedItems(){
  return DATA
    .filter(d=>Number(flipViews[d.n]||0)>0)
    .sort((a,b)=>(Number(flipViews[b.n]||0)-Number(flipViews[a.n]||0)) || a.n-b.n);
}

function dynamicSignature(items){
  return items.length ? items.map(it=>it.n).join(",") : "empty";
}

function appendDynamicPageSet(type, items, per, accent){
  const chunks = [];
  for(let i=0;i<items.length;i+=per) chunks.push(items.slice(i,i+per));
  if(chunks.length===0) chunks.push([]);
  chunks.forEach((chunk, idx)=>{
    PAGES.push({type, idx, items:chunk, accent, dynamic:true, sig:dynamicSignature(chunk)});
  });
}

function refreshDynamicPages(preferredType, preferredIdx){
  const current = PAGES[cur];
  const type = preferredType || (current && current.type);
  const idx = Number.isFinite(preferredIdx) ? preferredIdx : (current ? current.idx : 0);
  PAGES.length = STATIC_PAGE_COUNT;
  const marks = bookmarkedItems();
  appendDynamicPageSet("BE", marks, PER_P, DYN_ACCENT.BE);
  appendDynamicPageSet("BF", marks, PER_P, DYN_ACCENT.BF);
  appendDynamicPageSet("BR", marks, PER_P, DYN_ACCENT.BR);
  appendDynamicPageSet("V", flipViewedItems(), PER_C, DYN_ACCENT.V);
  if(isDynamicModeType(type)){
    const matches = PAGES.map((p,gi)=>({p,gi})).filter(x=>x.p.type===type);
    if(matches.length) cur = matches[Math.min(idx, matches.length-1)].gi;
  }
}

function loadCompletedCounts(){
  try{
    const raw = localStorage.getItem(COMPLETION_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === "object" ? parsed : {};
  }catch(e){
    return {};
  }
}

function saveCompletedCounts(){

}

function completionKey(p){
  return p.type+":"+p.idx+(p.sig?":"+p.sig:"");
}

function completedCountFor(p){
  return Number(completedCounts[completionKey(p)] || 0);
}

function buildState(p){
  const order = shuffle(p.items.map((_,i)=>i));
  if(isFlipHistoryPage(p)){ state[key(p)] = {answered:{}, correctCount:0, total:p.items.length, order, opts:{}, completionRecorded:false}; return; }
  if(isFillPage(p)){ state[key(p)] = {answered:{}, correctCount:0, total:p.items.length, order, opts:{}, revealed:false, retrying:{}, completedCorrect:{}, completionRecorded:false}; return; }
  const opts = {};
  p.items.forEach((it,i)=>{
    const correct = choiceAnswerText(p, it);
    const seen = new Set([correct]); const picks = [];
    for(const a of shuffle(choiceDistractorPool(p, it))){       // 同じ品詞内から
      if(!seen.has(a)){ seen.add(a); picks.push(a); if(picks.length===3) break; }
    }
    if(picks.length<3){                                        // 足りなければ全体から補充
      for(const a of shuffle(choiceFallbackPool(p))){
        if(!seen.has(a)){ seen.add(a); picks.push(a); if(picks.length===3) break; }
      }
    }
    opts[i] = shuffle([correct, ...picks]);
  });
  state[key(p)] = {answered:{}, correctCount:0, total:p.items.length, order, opts, completionRecorded:false};
}

    if(overlay.hidden || isWordDetailProtectedTarget(e.target)) return;

    }
  });
  updateFixedHeaderSpace();
  window.addEventListener("resize", updateFixedHeaderSpace);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", updateFixedHeaderSpace);
    window.visualViewport.addEventListener("scroll", updateFixedHeaderSpace);
  }
  if(navigator.virtualKeyboard){
    try{ navigator.virtualKeyboard.overlaysContent = true; }catch(e){}
    if(navigator.virtualKeyboard.addEventListener){

    main.addEventListener("touchstart", e=>{
      if(!e.target.closest || !e.target.closest(".fill-input")) cancelTypingAlignment();
    }, {passive:true});
    main.addEventListener("touchmove", cancelTypingAlignment, {passive:true});

}

function pageOptionText(p){
  if(!p || !p.items || p.items.length===0){
    if(p && isBookmarkModeType(p.type)) return String((p.idx||0)+1).padStart(3,"0")+" / Bookmarks 0 words";
    if(p && p.type==="V") return String((p.idx||0)+1).padStart(3,"0")+" / Flip Cards 0 words";
    return "000 / 0 words";
  }
  const first=p.items[0].n, last=p.items[p.items.length-1].n;
  if(isBookmarkModeType(p.type)) return String(p.idx+1).padStart(3,"0")+" / ★ No."+first+" - No."+last;
  if(p.type==="V") return String(p.idx+1).padStart(3,"0")+" / Views No."+first+" - No."+last;
  return String(p.idx+1).padStart(3,"0")+" / No."+first+" - No."+last;
}

function normalizeSearchText(s){
  const text = (s+"");
  const normalized = text.normalize ? text.normalize("NFKC") : text;
  return normalized.trim().toLowerCase().replace(/\s+/g," ");
}

function searchRank(item, q){
  const word = normalizeSearchText(item.w);
  const meaning = normalizeSearchText(item.a);
  const wordRank = word===q ? 0 : word.startsWith(q) ? 1 : word.includes(q) ? 2 : 99;
  const meaningRank = meaning===q ? 3 : meaning.startsWith(q) ? 4 : meaning.includes(q) ? 5 : 99;
  return Math.min(wordRank, meaningRank);
}

function pageForItemInMode(item, type){
  return PAGES.findIndex(p=>p.type===type && p.items.some(it=>it.n===item.n));
}

function updateSearchResults(){
  const input = document.getElementById("wordSearch");
  const box = document.getElementById("searchResults");
  if(!input || !box) return;
  const q = normalizeSearchText(input.value);
  box.innerHTML = "";
  if(!q){ box.hidden = true; return; }

  const scored = DATA
    .map(d=>({item:d, rank:searchRank(d, q)}))
    .filter(x=>x.rank<99)
    .sort((a,b)=>{
      return a.rank-b.rank || a.item.n-b.item.n;
    })
    .map(x=>x.item);
  box.hidden = false;
  if(scored.length===0){
    const empty=document.createElement("div");
    empty.className="search-empty";
    empty.textContent="No matching word";
    box.appendChild(empty);
    return;
  }

  const mode = (PAGES[cur] && PAGES[cur].type) || "P";
  scored.slice(0,12).forEach(item=>{
    const gi = pageForItemInMode(item, mode);
    const p = PAGES[gi] || PAGES[pageForItemInMode(item, "P")];
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="search-result";
    const word=document.createElement("span");
    word.className="search-word"; word.textContent=item.w;
    const meta=document.createElement("span");
    meta.className="search-meta"; meta.textContent="No."+item.n+" · "+(p ? pageOptionText(p) : "");
    const meaning=document.createElement("span");
    meaning.className="search-meaning"; meaning.textContent=item.a;
    btn.appendChild(word); btn.appendChild(meta); btn.appendChild(meaning);
    btn.onclick=()=>openWordDetail(item);
    btn.style.animationDelay=(Math.min(box.children.length, 10)*35)+"ms";
    box.appendChild(btn);
  });
}

let cachedEnglishVoice = null;
let speakTimer = null;
let speakToken = 0;

function englishVoice(){
  if(cachedEnglishVoice) return cachedEnglishVoice;
  if(!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
  const femaleName = /female|woman|girl|sonia|libby|serena|kate|amy|emma|susan|hazel|zira|aria|jenny|natasha|samantha|karen|moira|tessa|ava|allison|joanna|kendra|kimberly|salli|ivy|nicole|olivia|victoria|vicki|zoe|matilda|grace|fiona|veena|sandy|shelley/i;
  const american = v=>/^en[-_]US/i.test(v.lang) || /united states|american|us english/i.test(v.name);
  const english = v=>/^en/i.test(v.lang);
  const smooth = v=>/natural|neural|enhanced|premium|google|microsoft|siri/i.test(v.name);
  const novelty = v=>/bells|boing|bubbles|cellos|hysterical|junior|organ|trinoids|whisper|zarvox/i.test(v.name);
  const candidates = voices.filter(v=>american(v) && !novelty(v));
  const fallbacks = voices.filter(v=>english(v) && !novelty(v));
  cachedEnglishVoice = (candidates.length ? candidates : fallbacks)
    .sort((a,b)=>voiceSmoothnessScore(b)-voiceSmoothnessScore(a))[0] || null;

  function voiceSmoothnessScore(v){
    return (american(v) ? 220 : 0) +
      (femaleName.test(v.name) ? 90 : 0) +
      (smooth(v) ? 34 : 0) +
      (v.localService ? 18 : 0);
  }
  return cachedEnglishVoice;
}

function prepareSpeechEngine(){
  if(!("speechSynthesis" in window)) return;
  if(window.speechSynthesis.getVoices) window.speechSynthesis.getVoices();
  if(window.speechSynthesis.resume) window.speechSynthesis.resume();
}

function playbackPhrase(phrase){
  // Mobile TTS can clip the first vowel just as the audio path opens.
  const leadIn = /^[aeiou]/i.test(phrase) ? ", " : " ";
  return leadIn + phrase;
}

function speakEnglishText(text){
  if(!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance==="undefined") return;
  const phrase = (text || "").trim();
  if(!phrase) return;
  const synth = window.speechSynthesis;
  const token = ++speakToken;
  if(speakTimer) clearTimeout(speakTimer);
  prepareSpeechEngine();
  synth.cancel();
  speakTimer = setTimeout(()=>{
    if(token !== speakToken) return;
    prepareSpeechEngine();
    const utterance = new SpeechSynthesisUtterance(playbackPhrase(phrase));
    const voice = englishVoice();
    utterance.lang = "en-US";
    utterance.rate = 0.88;
    utterance.pitch = 1;
    if(voice) utterance.voice = voice;
    synth.speak(utterance);
    setTimeout(()=>{ if(token === speakToken) prepareSpeechEngine(); }, 90);
  }, 70);
}

function attachPronunciation(el, item){
  if(!el || !item) return;

function lockPageScroll(){
  if(document.body.classList.contains("overlay-scroll-lock")) return;
  overlayScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.top = (-overlayScrollY)+"px";
  document.documentElement.classList.add("overlay-scroll-lock");
  document.body.classList.add("overlay-scroll-lock");
}

function unlockPageScroll(){
  if(!document.body.classList.contains("overlay-scroll-lock")) return;
  document.documentElement.classList.remove("overlay-scroll-lock");
  document.body.classList.remove("overlay-scroll-lock");
  document.body.style.top = "";
  window.scrollTo(0, overlayScrollY);
}

function guardSearchOverlayScroll(e, deltaY){
  const overlay=document.getElementById("searchOverlay");
  if(overlay.hidden) return;
  const list=e.target.closest && e.target.closest("#searchResults");
  if(!list || list.hidden){
    e.preventDefault();
    return;
  }
  if(list.scrollHeight<=list.clientHeight){
    e.preventDefault();
    return;
  }
  const atTop=list.scrollTop<=0;
  const atBottom=Math.ceil(list.scrollTop+list.clientHeight)>=list.scrollHeight;
  if((deltaY<0 && atTop) || (deltaY>0 && atBottom)) e.preventDefault();
}

function prioritizeItemOnPage(p, item){
  const k = key(p);
  if(!state[k]) buildState(p);
  const st = state[k];
  const idx = p.items.findIndex(it=>it.n===item.n);
  if(idx<0) return;
  if(!Array.isArray(st.order) || !st.order.includes(idx)) st.order = p.items.map((_, i)=>i);
  st.order = [idx, ...st.order.filter(i=>i!==idx)];
  st.pinned = true;
}

function jumpDetailToQuizPage(){

  const gi = pageForItemInMode(detailItem, "P");
  if(gi>=0){
    prioritizeItemOnPage(PAGES[gi], detailItem);
    cur=gi;
    closeSearch();
    closeWordDetail();
    render();

function syncJumpControls(p){

function updateFixedHeaderSpace(){
  const header=document.querySelector("header");
  const footer=document.querySelector("footer");
  const root=document.documentElement;
  const apply=()=>{
    const headerH = header ? Math.ceil(header.getBoundingClientRect().height) : 0;
    const footerH = footer ? Math.ceil(footer.getBoundingClientRect().height) : 0;
    root.style.setProperty("--header-h", headerH+"px");
    root.style.setProperty("--footer-h", footerH+"px");
    updateTypingInset(headerH, footerH);
  };
  apply();
  requestAnimationFrame(apply);
}

// keyboard height + the bottom edge of the scrollable question area.
// header stays pinned to the visible top. footer stays at the layout bottom
// and gets covered by the keyboard. main lives between header and keyboard top.
function updateTypingInset(headerH, footerH){
  const root=document.documentElement;
  if(headerH==null) headerH = parseInt(getComputedStyle(root).getPropertyValue("--header-h")) || 0;
  if(footerH==null) footerH = parseInt(getComputedStyle(root).getPropertyValue("--footer-h")) || 0;
  const vv=window.visualViewport;
  // some mobile browsers (this Android Chrome included) SCROLL the visual
  // viewport when the keyboard opens. pin the header + question area to the
  // visible top so the menu never scrolls off-screen.
  const vvTop = vv ? Math.max(0, Math.round(vv.offsetTop)) : 0;
  const viewportKeyboardGap = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
  const vk = navigator.virtualKeyboard;
  const vkRect = vk && vk.boundingRect;
  const virtualKeyboardGap = vkRect ? Math.max(0, Math.round(vkRect.height || 0)) : 0;
  const keyboardGap = Math.max(viewportKeyboardGap, virtualKeyboardGap);
  root.style.setProperty("--vv-top", vvTop+"px");
  root.style.setProperty("--keyboard-h", keyboardGap+"px");
  root.style.setProperty("--main-bottom", (keyboardGap>0 ? keyboardGap : footerH)+"px");
  const keyboardOpen = keyboardGap > 0;
  const visibleViewportH = vv ? Math.min(vv.height, window.innerHeight - keyboardGap) : (window.innerHeight - keyboardGap);
  const visibleMain = Math.max(0, Math.round(visibleViewportH - headerH));
  const tailSpace = keyboardOpen ? keyboardTailSpaceForNaturalLimit(visibleMain) : 22;
  const instantLastFocus = keyboardOpen && isLastFillInput(document.activeElement);
  root.style.setProperty("--tail-space-transition", instantLastFocus ? "0s" : "1s");
  root.style.setProperty("--typing-tail-space", tailSpace+"px");
}

function keyboardTailSpaceForNaturalLimit(visibleMain){
  const main=document.querySelector("main");
  const last=main ? main.querySelector("#grid .card:last-child") : null;
  if(!main || !last) return Math.max(0, visibleMain - 24);
  const mainH = Math.max(0, Math.round(main.clientHeight || visibleMain));
  const lastH = Math.ceil(last.offsetHeight || last.getBoundingClientRect().height || 0);
  return Math.max(0, mainH - lastH);
}

function scrollQuestionAreaToTop(){

}

function render(){
  const p = PAGES[cur];
  const k = key(p);
  // fresh shuffle every visit while untouched; preserve progress and search jumps
  if(!state[k] || (Object.keys(state[k].answered).length===0 && !state[k].revealed && !state[k].pinned)) buildState(p);
  const st = state[k];
  document.documentElement.style.setProperty("--accent", p.accent);
  document.documentElement.style.setProperty("--accent-soft", p.accent+"1A");

  // header texts
  const hasItems = p.items.length>0;
  const first=hasItems ? p.items[0].n : 0, last=hasItems ? p.items[p.items.length-1].n : 0;
  const rangeText = hasItems ? "No."+first+"–"+last : "0語";
  if(p.type==="P"){
    document.getElementById("phBig").textContent="15 Words "+String(p.idx+1).padStart(2,"0");
    document.getElementById("phTag").textContent="PRACTICE";
    document.getElementById("phSub").textContent="15問 ・ No."+first+"–"+last;
  }else if(p.type==="C"){
    document.getElementById("phBig").textContent="CHALLENGE "+(p.idx+1);
    document.getElementById("phTag").textContent="CHALLENGE SESSION";
    document.getElementById("phSub").textContent=p.items.length+"問 ・ No."+first+"–"+last+" ・ 全"+DATA.length+"語ぶっ通し";
  }else if(p.type==="BE"){
    document.getElementById("phBig").textContent="★ English to Japanese (Choice) "+String(p.idx+1).padStart(2,"0");
    document.getElementById("phTag").textContent="和訳";
    document.getElementById("phSub").textContent=p.items.length+"問 ・ "+rangeText+" ・ ブックマーク";
  }else if(p.type==="BF"){
    document.getElementById("phBig").textContent="★ English to Japanese (Type) "+String(p.idx+1).padStart(2,"0");
    document.getElementById("phTag").textContent="和訳";
    document.getElementById("phSub").textContent=p.items.length+"問 ・ "+rangeText+" ・ ブックマーク";
  }else if(p.type==="BR"){
    document.getElementById("phBig").textContent="★ Japanese to English (Type) "+String(p.idx+1).padStart(2,"0");
    document.getElementById("phTag").textContent="英訳";
    document.getElementById("phSub").textContent=p.items.length+"問 ・ "+rangeText+" ・ ブックマーク";
  }else if(p.type==="V"){
    document.getElementById("phBig").textContent="Flip Cards "+String(p.idx+1).padStart(2,"0");
    document.getElementById("phTag").textContent="SEARCH HISTORY";
    document.getElementById("phSub").textContent=p.items.length+"語 ・ よく開いた順";
  }else{
    if(isJapaneseToEnglishFillPage(p)){
      document.getElementById("phBig").textContent="Japanese to English "+String(p.idx+1).padStart(2,"0");
      document.getElementById("phTag").textContent="英訳";
      document.getElementById("phSub").textContent="15問 ・ No."+first+"–"+last+" ・ 見出し語をタイプ";
    }else{
      document.getElementById("phBig").textContent="English to Japanese "+String(p.idx+1).padStart(2,"0");
      document.getElementById("phTag").textContent="和訳";
      document.getElementById("phSub").textContent="15問 ・ No."+first+"–"+last+" ・ 訳をタイプ";
    }
  }
  const revealBtn = document.getElementById("revealAnswers");
  const reshuffleBtn = document.getElementById("reshuffle");
  const completedEl = document.getElementById("completedCount");
  const hasQuizItems = !isFlipHistoryPage(p) && p.items.length>0;
  revealBtn.hidden = !hasQuizItems;
  revealBtn.disabled = !!st.revealed;
  revealBtn.textContent = st.revealed ? "Answer Revealed" : "Reveal Answers";
  reshuffleBtn.hidden = !hasQuizItems;
  completedEl.hidden = isFlipHistoryPage(p);

  syncJumpControls(p);
  updateCompletedDisplay(p);
  document.body.classList.toggle("fill-page", isFillPage(p));
  document.body.classList.toggle("flip-history-page", isFlipHistoryPage(p));
  updateFixedHeaderSpace();

  // grid
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  if(isFlipHistoryPage(p)){
    renderFlipHistoryCards(p, grid);
    updateScore();
    updateFixedHeaderSpace();
    scrollQuestionAreaToTop();
    document.getElementById("prev").disabled = cur===0;
    document.getElementById("next").disabled = cur===PAGES.length-1;
    return;
  }
  if(!hasItems){
    renderEmptyPage(p, grid);
    updateScore();
    updateFixedHeaderSpace();
    scrollQuestionAreaToTop();
    document.getElementById("prev").disabled = cur===0;
    document.getElementById("next").disabled = cur===PAGES.length-1;
    return;
  }
  if(isFillPage(p)){ renderFillCards(p, st, grid); updateScore(); updateFixedHeaderSpace(); scrollQuestionAreaToTop();
    document.getElementById("prev").disabled = cur===0;
    document.getElementById("next").disabled = cur===PAGES.length-1; return; }
  st.order.forEach((origIdx, displayPos)=>{
    const it=p.items[origIdx];
    const card=document.createElement("div"); card.className="card has-bookmark";
    const ans = st.answered[origIdx];
    const correct = choiceAnswerText(p, it);
    const promptText = choicePromptText(p, it);
    const speakablePrompt = !isJapaneseToEnglishChoicePage(p);
    const promptClass = isJapaneseToEnglishChoicePage(p) ? "word jp-prompt" : "word";
    const promptHtml = speakablePrompt ? '<span class="speak-target">'+escapeHtml(promptText)+'</span>' : escapeHtml(promptText);
    const helperText = isJapaneseToEnglishChoicePage(p) ? "" : (it.p || "");
    card.innerHTML =
      '<div class="top"><div class="qno">Q'+(displayPos+1)+' / No.'+it.n+'</div>'+
      '<div class="'+promptClass+'">'+promptHtml+'</div>'+
      '<div class="ipa">'+escapeHtml(helperText)+'</div></div>'+
      '<div class="opts"></div>';
    if(speakablePrompt) attachPronunciation(card.querySelector(".speak-target"), it);
    card.querySelector(".top").appendChild(createBookmarkButton(it));
    const optsWrap=card.querySelector(".opts");
    const letters=["A","B","C","D"];
    st.opts[origIdx].forEach((optText,oi)=>{
      const btn=document.createElement("button");
      btn.className="opt"; btn.disabled = !!ans || !!st.revealed;
      btn.innerHTML='<span class="mk">'+letters[oi]+'</span>'+escapeHtml(optText);
      if(ans){
        if(optText===correct) btn.classList.add("correct");
        else if(optText===ans.picked) btn.classList.add("wrong");
      }else if(st.revealed && optText===correct){
        btn.classList.add("correct");
      }
      btn.onclick=(e)=>answer(p,origIdx,optText,e.currentTarget);
      optsWrap.appendChild(btn);
    });
    grid.appendChild(card);
  });
  updateScore();
  scrollQuestionAreaToTop();
  document.getElementById("prev").disabled = cur===0;
  document.getElementById("next").disabled = cur===PAGES.length-1;
}

function renderEmptyPage(p, grid){
  const empty=document.createElement("div");
  empty.className="empty";
  empty.textContent = isBookmarkModeType(p.type) ? "ブックマークした単語はまだありません" : "表示する単語がありません";
  grid.appendChild(empty);
}

function renderFlipHistoryCards(p, grid){
  if(p.items.length===0){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="表示履歴はまだありません";
    grid.appendChild(empty);
    return;
  }
  p.items.forEach(item=>{
    const card=document.createElement("div");
    card.className="card history-card";
    card.innerHTML =
      '<div class="history-main">'+
      '<span class="history-no">No.'+item.n+' · '+Number(flipViews[item.n]||0)+' views</span>'+
      '<div class="history-word"><span class="speak-target">'+escapeHtml(item.w)+'</span></div>'+
      '<div class="history-meaning">'+escapeHtml(item.a)+'</div>'+
      '</div><div class="history-actions"></div>';
    attachPronunciation(card.querySelector(".speak-target"), item);
    const actions=card.querySelector(".history-actions");
    actions.appendChild(createBookmarkButton(item));
    const open=document.createElement("button");
    open.type="button";
    open.className="history-open";
    open.textContent="Flip";
    open.addEventListener("click", e=>{
      e.preventDefault();
      e.stopPropagation();
      openWordDetail(item);
    });
    actions.appendChild(open);
    grid.appendChild(card);
  });
}

function renderFillCards(p, st, grid){
  if(!st.retrying) st.retrying = {};
  st.order.forEach((origIdx, pos)=>{
    const it = p.items[origIdx];
    const ans = st.answered[origIdx];
    const isRetrying = !!st.retrying[origIdx];
    const expectedAnswer = fillAnswerText(p, it);
    const promptText = fillPromptText(p, it);
    const speakablePrompt = !isJapaneseToEnglishFillPage(p);
    const promptClass = isJapaneseToEnglishFillPage(p) ? "word jp-prompt" : "word";
    const promptHtml = speakablePrompt ? '<span class="speak-target">'+escapeHtml(promptText)+'</span>' : escapeHtml(promptText);
    const helperText = isJapaneseToEnglishFillPage(p) ? "" : (it.p || "");
    const card=document.createElement("div"); card.className=st.revealed ? "card has-retry has-bookmark" : "card has-bookmark";
    card.innerHTML =
      '<div class="top"><div class="qno">Q'+(pos+1)+' / No.'+it.n+'</div>'+
      '<div class="'+promptClass+'">'+promptHtml+'</div>'+
      '<div class="ipa">'+escapeHtml(helperText)+'</div></div>'+
      '<div class="fillbox"></div>';
    const box=card.querySelector(".fillbox");
    const top=card.querySelector(".top");
    if(speakablePrompt) attachPronunciation(card.querySelector(".speak-target"), it);
    if(top) top.appendChild(createBookmarkButton(it));
    const inp=document.createElement("input");
    inp.type="text"; inp.className="fill-input"; inp.placeholder=fillPlaceholderText(p);
    // exam-style blank: suppress suggestions and autofill heuristics.
    // A non-semantic random name keeps Chrome from matching a known field type.
    inp.setAttribute("autocomplete","new-password"); inp.setAttribute("autocapitalize","none");
    inp.setAttribute("autocorrect","off"); inp.setAttribute("spellcheck","false");
    inp.setAttribute("inputmode","text");
    inp.setAttribute("name","blank_"+Math.random().toString(36).slice(2,10));
    inp.setAttribute("data-lpignore","true");
    inp.setAttribute("data-1p-ignore","true");
    inp.setAttribute("data-bwignore","true");
    inp.setAttribute("data-protonpass-ignore","true");
    inp.setAttribute("data-form-type","other");
    inp.setAttribute("data-autofill","off");
    inp.setAttribute("aria-autocomplete","none");
    const enterHint = "enter";
    inp.enterKeyHint = enterHint;
    inp.setAttribute("enterkeyhint", enterHint);
    const status=document.createElement("div"); status.className="fill-status";
    function resetInputClasses(){
      inp.classList.remove("correct","revealed","retrying","speak-answer");
      status.classList.remove("ok","shown","retrying");
    }
    function lock(displayValue){
      resetInputClasses();
      inp.value = displayValue == null ? expectedAnswer : displayValue; inp.classList.add("correct"); inp.dataset.locked="1"; inp.readOnly=true;
      if(isJapaneseToEnglishFillPage(p)){ inp.classList.add("speak-answer"); inp.title="Play pronunciation"; }
      else inp.removeAttribute("title");
      status.textContent="✓ 正解"; status.classList.add("ok");
    }
    function reveal(){
      resetInputClasses();
      st.retrying[origIdx] = false;
      inp.value = expectedAnswer; inp.classList.add("revealed"); inp.dataset.locked="1"; inp.readOnly=true;
      if(isJapaneseToEnglishFillPage(p)){ inp.classList.add("speak-answer"); inp.title="Play pronunciation"; }
      else inp.removeAttribute("title");
      status.textContent="Answer revealed"; status.classList.add("shown");
    }
    function retryTyping(shouldFocus){
      resetInputClasses();
      st.retrying[origIdx] = true;
      delete inp.dataset.locked;
      inp.readOnly=false;
      inp.value="";
      inp.removeAttribute("title");
      inp.classList.add("retrying");
      status.textContent="Retype mode";
      status.classList.add("retrying");
      if(shouldFocus){
        try{ inp.focus({preventScroll:true}); }catch(err){ inp.focus(); }
      }
    }
    if(isRetrying){ retryTyping(false); }
    else if(ans){ lock(ans.picked || expectedAnswer); }
    else if(st.revealed){ reveal(); }
    if(st.revealed && top){
      const answerBtn=document.createElement("button");
      answerBtn.type="button";
      answerBtn.className="fill-answer-btn";
      answerBtn.textContent="👁";
      answerBtn.setAttribute("aria-label","Show answer");
      answerBtn.title="Show answer";
      answerBtn.addEventListener("click", e=>{
        e.preventDefault();
        e.stopPropagation();
        reveal();
      });
      top.appendChild(answerBtn);
      const retryBtn=document.createElement("button");
      retryBtn.type="button";
      retryBtn.className="fill-retry-btn";
      retryBtn.textContent="↻";
      retryBtn.setAttribute("aria-label","Retype this answer");
      retryBtn.title="Retype";
      retryBtn.addEventListener("click", e=>{
        e.preventDefault();
        e.stopPropagation();
        retryTyping(true);
      });
      top.appendChild(retryBtn);
    }
    const check=e=>{
      if(e && e.isComposing) return;  // wait for Japanese IME conversion to finish
      if(inp.dataset.locked) return;   // already correct: keep the user's displayed order
      const v = inp.value.trim();
      if(st.revealed && st.retrying && st.retrying[origIdx]){
        if(v && isCorrectTypedAnswer(p, v, expectedAnswer)){
          st.retrying[origIdx] = false;
          markFillCorrectForCompletion(st, origIdx);
          lock(v);
          recordPageCompletionIfReady(p);
        }
        return;
      }
      if(v && isCorrectTypedAnswer(p, v, expectedAnswer)){
        lock(v);                                              // turn green + lock the instant it matches
        markFillCorrectForCompletion(st, origIdx);
        if(!st.answered[origIdx]){ st.answered[origIdx]={ok:true,picked:v}; st.correctCount++; }
        updateScore();
        recordPageCompletionIfReady(p);
        focusNextBlankInput(inp);
      }
    };
    inp.addEventListener("input", check);
    inp.addEventListener("compositionend", check);
    inp.addEventListener("keydown", e=>{
      if(e.key !== "Enter") return;
      if(e.isComposing) return;
      e.preventDefault();
      setTimeout(()=>check(), 0);
    });
    inp.addEventListener("pointerdown", beginTypingFocus);
    inp.addEventListener("touchstart", beginTypingFocus, {passive:true});
    inp.addEventListener("click", e=>{
      if(isJapaneseToEnglishFillPage(p) && inp.dataset.locked && inp.classList.contains("speak-answer")){
        e.preventDefault();
        e.stopPropagation();
        speakEnglishText(expectedAnswer);
        return;
      }
      requestTypingCardAlignFromPointer(inp);
    });
    inp.addEventListener("focus", ()=>scheduleTypingCardTopAlign(inp));
    inp.addEventListener("blur", e=>{ check(e); clearTypingFocusIfIdle(); });
    card.addEventListener("click", e=>{
      if(e.target.closest && e.target.closest(".fill-input")) return;
      if(e.target.closest && e.target.closest(".fill-retry-btn,.fill-answer-btn,.bookmark-btn")) return;
      if(inp.dataset.locked || inp.readOnly) return;
      try{ inp.focus({preventScroll:true}); }catch(err){ inp.focus(); }
    });
    box.appendChild(inp); box.appendChild(status);
    grid.appendChild(card);
  });
}

function answer(p,origIdx,picked,btnEl){
  const st=state[key(p)];
  if(st.answered[origIdx]) return;
  const correct = choiceAnswerText(p, p.items[origIdx]);
  st.answered[origIdx]={picked, ok:picked===correct};
  if(picked===correct) st.correctCount++;
  // update just this card's buttons in place (no re-render, no scroll jump)
  const wrap = btnEl.closest(".opts");
  const btns = wrap.querySelectorAll(".opt");
  btns.forEach((b,i)=>{
    b.disabled = true;
    const txt = st.opts[origIdx][i];
    if(txt===correct) b.classList.add("correct");
    else if(b===btnEl) b.classList.add("wrong");
  });
  updateScore();
  recordPageCompletionIfReady(p);
}

function updateScore(){
  // global tally across all visited pages
  let c=0,a=0;
  Object.values(state).forEach(s=>{c+=s.correctCount; a+=Object.keys(s.answered).length;});
  document.getElementById("sCorrect").textContent=c;
  document.getElementById("sAns").textContent=a;
  // page meter
  const st=state[key(PAGES[cur])];
  const done=Object.keys(st.answered).length;
  const pct=st.total ? Math.round(done/st.total*100) : 0;
  document.getElementById("meter").style.width=pct+"%";
  document.getElementById("pct").textContent=pct+"%";
}

function updateCompletedDisplay(p){
  const el=document.getElementById("completedCount");
  if(!el || !p) return;
  const count = completedCountFor(p);
  el.innerHTML = '<span>Completed:</span><span><span class="completed-number">'+count+'</span> <span class="completed-unit">'+(count===1 ? "time" : "times")+'</span></span>';
}

function markFillCorrectForCompletion(st, origIdx){
  if(!st.completedCorrect) st.completedCorrect = {};
  st.completedCorrect[origIdx] = true;
}

function pageAttemptIsComplete(p, st){
  if(!p || !st) return false;
  if(isFillPage(p)){
    if(!st.completedCorrect) st.completedCorrect = {};
    return p.items.every((_,i)=>!!st.completedCorrect[i] || !!(st.answered[i] && st.answered[i].ok));
  }
  return Object.keys(st.answered).length >= st.total;
}

function recordPageCompletionIfReady(p){
  const st=state[key(p)];
  if(!st){ updateCompletedDisplay(p); return; }
  if(!st.completionRecorded && pageAttemptIsComplete(p, st)){
    const ck = completionKey(p);
    completedCounts[ck] = completedCountFor(p) + 1;
    st.completionRecorded = true;
    saveCompletedCounts();
  }
  updateCompletedDisplay(p);
}

function escapeHtml(s){return (s+"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}

function isJapaneseToEnglishChoicePage(p){
  return p && p.type==="BJ";
}

function choicePromptText(p, it){
  return isJapaneseToEnglishChoicePage(p) ? it.a : it.w;
}

function choiceAnswerText(p, it){
  return isJapaneseToEnglishChoicePage(p) ? it.w : it.a;
}

function choiceDistractorPool(p, it){
  return isJapaneseToEnglishChoicePage(p) ? wordDistractorPool(it.pos) : distractorPool(it.pos);
}

function choiceFallbackPool(p){
  return isJapaneseToEnglishChoicePage(p) ? ALL_WORDS : ALL;
}

function isFlipHistoryPage(p){
  return p && p.type==="V";
}

function isFillPage(p){
  return p && (p.type==="F" || p.type==="R" || p.type==="BF" || p.type==="BR");
}

function isJapaneseToEnglishFillPage(p){
  return p && (p.type==="R" || p.type==="BR");
}

function fillPromptText(p, it){
  return isJapaneseToEnglishFillPage(p) ? it.a : it.w;
}

function fillAnswerText(p, it){
  return isJapaneseToEnglishFillPage(p) ? it.w : it.a;
}

function fillPlaceholderText(p){
  return isJapaneseToEnglishFillPage(p) ? "見出し語をタイプ…" : "日本語訳をタイプ…";
}

function normalizeTypedAnswer(p, s){
  return isJapaneseToEnglishFillPage(p) ? normalizeEnglishAnswer(s) : normalizeFillAnswer(s);
}

function isCorrectTypedAnswer(p, typed, expected){
  if(!isJapaneseToEnglishFillPage(p)) return japaneseFillAnswerMatches(typed, expected);
  return normalizeTypedAnswer(p, typed) === normalizeTypedAnswer(p, expected);
}

function japaneseFillAnswerMatches(typed, expected){
  const typedParts = splitJapaneseAnswerParts(typed);
  const expectedParts = splitJapaneseAnswerParts(expected);
  if(expectedParts.length <= 1) return normalizeFillAnswer(typed) === normalizeFillAnswer(expected);
  if(typedParts.length !== expectedParts.length) return false;
  const counts = new Map();
  expectedParts.forEach(part=>counts.set(part, (counts.get(part)||0)+1));
  for(const part of typedParts){
    const next = (counts.get(part)||0) - 1;
    if(next < 0) return false;
    if(next === 0) counts.delete(part);
    else counts.set(part, next);
  }
  return counts.size === 0;
}

function splitJapaneseAnswerParts(s){
  return normalizeFillAnswer(s).split("、").filter(Boolean);
}

function normalizeFillAnswer(s){
  return (s+"").replace(/[，,]/g,"、").replace(/\s+/g,"").trim();
}

function normalizeEnglishAnswer(s){
  return (s+"").trim().replace(/\s+/g," ").toLowerCase();
}

function focusNextBlankInput(currentInput){
  const inputs = Array.from(document.querySelectorAll(".fill-input"));
  const start = inputs.indexOf(currentInput);
  if(start < 0) return;
  for(let step=1; step<=inputs.length; step++){
    const next = inputs[(start + step) % inputs.length];
    if(next && !next.dataset.locked && !next.readOnly){
      // preventScroll keeps the browser from doing its own jump; we align the
      // card to the header ourselves in the focus handler.
      try{ next.focus({preventScroll:true}); }catch(e){ next.focus(); }
      return;
    }
  }
}

// ----- typing focus / centering state -----
let focusedInput = null;     // the input the user is currently editing
let settleRAF = null;        // running stability watcher
let alignRAF = null;         // running card top alignment animation
let alignTimeouts = [];      // delayed settling corrections
let alignToken = 0;          // cancels stale alignment animations
let settleSnap = null;       // last sampled layout fingerprint
let settleStill = 0;         // frames the layout has been unchanged
let settleFrames = 0;        // safety frame cap
let pointerAlignInput = null;
let pointerAlignAt = 0;

function clearAlignTimeouts(){
  alignTimeouts.forEach(clearTimeout);
  alignTimeouts = [];
}

function cancelTypingAlignment(){
  clearAlignTimeouts();
  cancelAnimationFrame(alignRAF);
  alignRAF = null;
  alignToken++;
}

function clearTypingFocusIfIdle(){
  setTimeout(()=>{
    const active=document.activeElement;
    if(!active || !active.classList || !active.classList.contains("fill-input")){
      focusedInput = null;
      cancelAnimationFrame(settleRAF);
      cancelTypingAlignment();
      document.body.classList.remove("last-fill-focus");
      document.body.classList.remove("typing-focus");
      updateFixedHeaderSpace();
    }
  }, 150);
}

function beginTypingFocus(){
  document.body.classList.add("typing-focus");
  updateFixedHeaderSpace();
}

function requestTypingCardAlignFromPointer(input){
  beginTypingFocus();
  const now = performance.now();
  if(pointerAlignInput===input && now-pointerAlignAt < 120) return;
  pointerAlignInput = input;
  pointerAlignAt = now;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(input && input.isConnected && document.activeElement===input){
        scheduleTypingCardTopAlign(input);
      }
    });
  });
}

// entry point fired on input focus (tap or programmatic move to next/prev blank).
// instead of guessing delays, we wait until BOTH the visual viewport (keyboard
// animation + the browser's own scroll-into-view on a manual tap) AND the
// scroll position have stopped moving, then align the card top to the header.
function scheduleTypingCardTopAlign(input){
  if(!input || !input.isConnected) return;
  document.body.classList.toggle("last-fill-focus", isLastFillInput(input));
  beginTypingFocus();
  focusedInput = input;
  cancelAnimationFrame(settleRAF);
  cancelTypingAlignment();
  settleSnap = null;
  settleStill = 0;
  settleFrames = 0;
  settleRAF = requestAnimationFrame(watchUntilSettled);
}

function layoutFingerprint(){
  const vv = window.visualViewport;
  const main = document.querySelector("main");
  const h = vv ? Math.round(vv.height) : Math.round(window.innerHeight);
  const t = vv ? Math.round(vv.offsetTop) : 0;
  const s = main ? Math.round(main.scrollTop) : 0;
  const mh = main ? Math.round(main.clientHeight) : 0;
  return h+":"+t+":"+s+":"+mh;
}

function watchUntilSettled(){
  if(!focusedInput || document.activeElement!==focusedInput){ settleRAF=null; return; }
  const fp = layoutFingerprint();
  if(fp===settleSnap) settleStill++; else { settleStill=0; settleSnap=fp; }
  settleFrames++;
  // settled for ~4 frames, or hit the safety cap (~1s) -> one alignment pass.
  if(settleStill>=4 || settleFrames>70){
    finishTypingCardTopAlign(focusedInput);
    settleRAF=null;
    return;
  }
  settleRAF = requestAnimationFrame(watchUntilSettled);
}

function finishTypingCardTopAlign(input){
  clearAlignTimeouts();
  const primaryDuration = isLastFillInput(input) ? 80 : 260;
  const followupDuration = isLastFillInput(input) ? 80 : 180;
  alignActiveTypingCardTop(input, primaryDuration);
  // Mobile browsers sometimes make one last scroll adjustment after the
  // keyboard finishes animating. Keep every correction animated so there is no
  // visible snap back from under the header.
  alignTimeouts = [320, 560, 840].map(delay=>
    setTimeout(()=>alignActiveTypingCardTop(input, followupDuration), delay)
  );
}

function alignActiveTypingCardTop(input, duration){
  if(!input || document.activeElement!==input) return;
  alignTypingCardTop(input, duration);
}

function alignTypingCardTop(input, duration){
  if(!input || !input.isConnected) return;
  const scroller=document.querySelector("main");
  if(!scroller) return;
  const token = ++alignToken;
  cancelAnimationFrame(alignRAF);
  const started = performance.now();
  const total = Math.max(80, duration || 0);
  const tick = now=>{
    if(token!==alignToken || !input.isConnected || document.activeElement!==input){ alignRAF=null; return; }
    const card = input.closest(".card") || input;
    const mainRect = scroller.getBoundingClientRect();   // top = header bottom
    const cardRect = card.getBoundingClientRect();
    const delta = cardRect.top - mainRect.top;
    if(Math.abs(delta) < 0.8 || now-started >= total){
      setMainScrollTop(scroller, scroller.scrollTop + delta);
      alignRAF=null;
      return;
    }
    const progress = Math.min(1, (now-started) / total);
    const factor = 0.16 + (0.34 * progress);
    setMainScrollTop(scroller, scroller.scrollTop + (delta * factor));
    alignRAF = requestAnimationFrame(tick);
  };
  alignRAF = requestAnimationFrame(tick);
}

function setMainScrollTop(scroller, value){
  scroller.scrollTop = clampMainScrollTop(scroller, value);
}

function isLastFillInput(input){
  if(!input || !input.classList || !input.classList.contains("fill-input")) return false;
  const card = input.closest(".card");
  const main = document.querySelector("main");
  const last = main ? main.querySelector("#grid .card:last-child") : null;
  return !!card && card === last;
}

function clampMainScrollTop(scroller, value){
  const max = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
  const limit = lastFillCardTopLimit(scroller);
  const effectiveMax = limit==null ? max : Math.min(max, limit);
  return Math.max(0, Math.min(effectiveMax, value));
}

function lastFillCardTopLimit(scroller){
  if(!document.body.classList.contains("fill-page")) return null;
  const keyboardH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--keyboard-h")) || 0;
  if(keyboardH <= 0) return null;
  const cards = scroller.querySelectorAll("#grid .card");
  const last = cards[cards.length-1];
  if(!last) return null;
  const mainRect = scroller.getBoundingClientRect();
  const lastRect = last.getBoundingClientRect();
  return Math.max(0, scroller.scrollTop + (lastRect.top - mainRect.top));
}

function revealFillAnswers(){
  const btn = document.getElementById("revealAnswers");
  if(btn){
    btn.classList.add("button-pressing");
    setTimeout(()=>btn.classList.remove("button-pressing"), 140);
  }
  const p = PAGES[cur];
  const k = key(p);
  if(!state[k]) buildState(p);
  state[k].revealed = true;
  render();
}

document.getElementById("revealAnswers").onclick=revealFillAnswers;
document.getElementById("reshuffle").onclick=()=>{ buildState(PAGES[cur]); render(); };
document.getElementById("prev").onclick=()=>{ if(cur>0){cur--;render();} };
document.getElementById("next").onclick=()=>{ if(cur<PAGES.length-1){cur++;render();} };

buildPager();
render();
window.addEventListener("pageshow", resyncJumpControlsSoon);
window.addEventListener("load", resyncJumpControlsSoon);
</script>
