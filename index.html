<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検1級 単語クイズ ｜ 1601–1900</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF3E4; --ink:#1E1B16; --line:#1E1B16;
  --correct:#1F9D55; --correct-bg:#D7F2DF;
  --wrong:#E23E3E; --wrong-bg:#FBDADA;
  --shadow:6px 6px 0 var(--line);
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --disp:"Fraunces",Georgia,serif;
  --mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--line) 0.6px, transparent 0.6px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--jp);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  padding-bottom:120px;
}
header{
  position:sticky; top:0; z-index:50;
  background:var(--paper); border-bottom:3px solid var(--line);
}
.bar{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:900;font-size:1.5rem;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.18em;color:#8a7a5c;margin-top:3px}
.scorebox{margin-left:auto;display:flex;gap:8px;align-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem}
.chip{border:2.5px solid var(--line);background:#fff;padding:5px 10px;border-radius:999px;box-shadow:3px 3px 0 var(--line)}
.chip b{color:var(--accent,#F4633A)}
.pager{max-width:1100px;margin:0 auto;padding:0 12px 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin}
.pager button{
  flex:0 0 auto;font-family:var(--mono);font-weight:700;font-size:.82rem;
  border:2.5px solid var(--line);background:#fff;color:var(--ink);
  width:38px;height:38px;border-radius:10px;cursor:pointer;transition:transform .08s,box-shadow .08s;
}
.pager button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--line)}
.pager button.on{background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--line);transform:translate(-1px,-1px)}
.pager .sep{flex:0 0 auto;align-self:center;width:3px;height:26px;background:var(--line);margin:0 4px;border-radius:2px}
.pager button.ch{width:auto;padding:0 12px;background:#1E1B16;color:#FBF3E4}
.pager button.ch.on{background:var(--accent);color:#fff}
main{max-width:1100px;margin:0 auto;padding:22px 18px 0}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead .big{font-family:var(--disp);font-weight:900;font-size:2.6rem;line-height:.95;letter-spacing:-.02em}
.pagehead .tag{font-family:var(--mono);font-weight:700;font-size:.72rem;letter-spacing:.12em;background:var(--accent);color:#fff;padding:6px 12px;border:2.5px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.pagehead .sub{font-size:.9rem;color:#7a6c50}
.reshuffle{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:.82rem;border:2.5px solid var(--line);background:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s}
.reshuffle:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--line)}
.reshuffle:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{
  background:#fff;border:3px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.card .top{padding:14px 16px 10px;border-bottom:3px solid var(--line);position:relative;background:var(--accent-soft,#fff)}
.card .qno{position:absolute;top:10px;right:12px;font-family:var(--mono);font-weight:700;font-size:.62rem;color:#9a8a6a}
.card .word{font-family:var(--disp);font-weight:900;font-size:1.85rem;letter-spacing:-.02em;line-height:1.05;word-break:break-word}
.card .ipa{font-family:var(--mono);font-size:.78rem;color:#8a7a5c;margin-top:3px}
.opts{display:flex;flex-direction:column;gap:0;padding:0}
.opt{
  text-align:left;font-family:var(--jp);font-size:.98rem;color:var(--ink);
  background:#fff;border:none;border-top:2px solid #eadfca;
  padding:13px 15px 13px 44px;cursor:pointer;position:relative;transition:background .12s;
  line-height:1.35;
}
.opt:first-child{border-top:none}
.opt:hover:not(:disabled){background:#FFF3D6}
.opt .mk{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:2.5px solid var(--line);border-radius:6px;font-family:var(--mono);font-weight:700;font-size:.72rem;display:flex;align-items:center;justify-content:center;background:#fff}
.opt.correct{background:var(--correct-bg)}
.opt.correct .mk{background:var(--correct);color:#fff;border-color:var(--correct)}
.opt.wrong{background:var(--wrong-bg)}
.opt.wrong .mk{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt:disabled{cursor:default}
.empty{text-align:center;color:#9a8a6a;padding:40px;font-family:var(--mono)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:var(--paper);border-top:3px solid var(--line);z-index:50}
.fbar{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.fbar .navb{font-family:var(--mono);font-weight:700;font-size:.8rem;border:2.5px solid var(--paper);background:transparent;color:var(--paper);padding:9px 16px;border-radius:10px;cursor:pointer;transition:transform .08s}
.fbar .navb:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.fbar .navb:disabled{opacity:.3;cursor:default}
.fbar .meter{flex:1;height:14px;border:2.5px solid var(--paper);border-radius:999px;overflow:hidden;background:#3a342a}
.fbar .meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.fbar .pct{font-family:var(--mono);font-weight:700;font-size:.82rem;min-width:64px;text-align:right}
@media(max-width:560px){
  .pagehead .big{font-size:2rem}
  .card .word{font-size:1.55rem}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<header>
  <div class="bar">
    <div class="logo">EIKEN 1級 WORD QUIZ<small>RANK&nbsp;C ／ NO.&nbsp;1601–1900 ／ 300 WORDS</small></div>
    <div class="scorebox">

</header>
<main>

    <button class="reshuffle" id="reshuffle">↻ 再シャッフル</button>
  </div>
  <div class="grid" id="grid"></div>

<footer>

    <span class="pct" id="pct">0%</span>
    <button class="navb" id="next">次へ ▶</button>

</footer>

t", "p": "[əfrʌ́nt]", "a": "（公然の）侮辱"}, {"n": 1870, "w": "barrage", "p": "[bərɑ́ːʒ]", "a": "集中砲火、弾幕"}, {"n": 1871, "w": "brunt", "p": "[brʌnt]", "a": "矢面、（攻撃の）矛先"}, {"n": 1872, "w": "audacious", "p": "[ɔːdéɪʃəs]", "a": "大胆な、無鉄砲な"}, {"n": 1873, "w": "colloquial", "p": "[kəlóUkwiəl]", "a": "口語体の"}, {"n": 1874, "w": "concerted", "p": "[kənsə́ːrt̬ɪd]", "a": "協力しての、共同での"}, {"n": 1875, "w": "cumbersome", "p": "[kʌ́mbərsəm]", "a": "（大きく重くて）扱いにくい、手に負えない"}, {"n": 1876, "w": "egregious", "p": "[ɪɡríːdʒəs]", "a": "実にひどい、途方もない"}, {"n": 1877, "w": "eminent", "p": "[émɪnənt]", "a": "高名な、傑出した"}, {"n": 1878, "w": "enigmatic", "p": "[ènɪɡmǽt̬ɪk]", "a": "謎めいた、不可解な"}, {"n": 1879, "w": "extraneous", "p": "[ɪkstréɪniəs]", "a": "無関係の、本質的でない"}, {"n": 1880, "w": "inconspicuous", "p": "[ɪ̀nkənspÍkjuəs]", "a": "目立たない、地味な"}, {"n": 1881, "w": "indulgent", "p": "[ɪndʌ́ldʒənt]", "a": "甘い、寛大な"}, {"n": 1882, "w": "queasy", "p": "[kwíːzi]", "a": "吐き気のする"}, {"n": 1883, "w": "repulsive", "p": "[rɪpʌ́lsɪv]", "a": "嫌悪感を起こさせる、不快な"}, {"n": 1884, "w": "scruffy", "p": "[skrʌ́fi]", "a": "汚らしい、だらしない"}, {"n": 1885, "w": "contentious", "p": "[kənténʃəs]", "a": "論争好きな"}, {"n": 1886, "w": "inscrutable", "p": "[ɪnskrúːt̬əbl]", "a": "不可思議な、計り知れない"}, {"n": 1887, "w": "exemplary", "p": "[ɪɡzémpləri]", "a": "模範的な"}, {"n": 1888, "w": "transient", "p": "[trǽnziənt]", "a": "はかない"}, {"n": 1889, "w": "latent", "p": "[léɪtənt]", "a": "潜在的な"}, {"n": 1890, "w": "extrinsic", "p": "[ekstrɪ́nsɪk]", "a": "外的な、非本質的な"}, {"n": 1891, "w": "adamant", "p": "[ǽdəmənt]", "a": "断固主張して"}, {"n": 1892, "w": "abject", "p": "[ǽbdʒekt]", "a": "絶望的な、悲惨な"}, {"n": 1893, "w": "adroit", "p": "[ədrɔ́ɪt]", "a": "巧みな、器用な"}, {"n": 1894, "w": "arbitrary", "p": "[ɑ́ːrbətrèri]", "a": "独断的な、専制的な、気まぐれな"}, {"n": 1895, "w": "benign", "p": "[bənáɪn]", "a": "優しい、温和な、（気候などが）穏やかな、（病理学的に）良性の"}, {"n": 1896, "w": "belatedly", "p": "[bɪléɪt̬ɪdli]", "a": "遅れて、手遅れで"}, {"n": 1897, "w": "cordially", "p": "[kɔ́(ː)rdʒəli]", "a": "心から、真心を込めて"}, {"n": 1898, "w": "exponentially", "p": "[èkspənénʃəli]", "a": "（増加が）急激に、指数関数的に"}, {"n": 1899, "w": "figuratively", "p": "[fɪ́ɡjərət̬ɪvli]", "a": "比喩的に"}, {"n": 1900, "w": "vehemently", "p": "[víːəməntli]", "a": "激しく、猛烈に"}];
const ALL = DATA.map(d=>d.a);
// curated vibrant accent palette (memory hooks); one per page
const PAL = ["#F4633A","#0E7C7B","#E4007C","#2D5BFF","#E8A300","#7A3CC4","#0FA958","#D7263D","#147B8C","#C2185B","#3D7A00","#FF8A00","#1565C0","#8E24AA","#E65100","#00897B","#5D4037","#AD1457","#283593","#F4633A"];
const CH_PAL = ["#111", "#2D5BFF", "#E4007C"];

// pages: 20 practice (15 each) + 3 challenge (100 each)
const PAGES = [];
for(let i=0;i<20;i++) PAGES.push({type:"P", idx:i, items:DATA.slice(i*15,i*15+15), accent:PAL[i%PAL.length]});
for(let c=0;c<3;c++) PAGES.push({type:"C", idx:c, items:DATA.slice(c*100,c*100+100), accent:["#7A3CC4","#0E7C7B","#D7263D"][c]});

let cur = 0;
const state = {}; // pageKey -> {answered:Set, correctCount, total, order:[...], opts:{idx:[...]}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function key(p){return p.type+p.idx;}

function buildState(p){
  const order = shuffle(p.items.map((_,i)=>i));
  const opts = {};
  p.items.forEach((it,i)=>{
    const pool = shuffle(ALL.filter(a=>a!==it.a)).slice(0,3);
    opts[i] = shuffle([it.a, ...pool]);
  });
  state[key(p)] = {answered:{}, correctCount:0, total:p.items.length, order, opts};
}

function buildPager(){
  const pg = document.getElementById("pager");
  pg.innerHTML="";
  PAGES.forEach((p,gi)=>{
    if(p.type==="C" && PAGES[gi-1] && PAGES[gi-1].type==="P"){
      const s=document.createElement("span"); s.className="sep"; pg.appendChild(s);
    }
    const b=document.createElement("button");
    if(p.type==="P"){b.textContent=p.idx+1;}
    else{b.className="ch"; b.textContent="CH"+(p.idx+1);}
    b.dataset.gi=gi;
    b.onclick=()=>{cur=gi;render();};
    pg.appendChild(b);
  });
}

function render(){
  const p = PAGES[cur];
  const k = key(p);
  // fresh shuffle every visit while the page is still untouched; preserve progress once answering starts
  if(!state[k] || Object.keys(state[k].answered).length===0) buildState(p);
  const st = state[k];
  document.documentElement.style.setProperty("--accent", p.accent);
  document.documentElement.style.setProperty("--accent-soft", p.accent+"1A");

  // header texts
  const first=p.items[0].n, last=p.items[p.items.length-1].n;
  if(p.type==="P"){
    document.getElementById("phBig").textContent="PAGE "+String(p.idx+1).padStart(2,"0");
    document.getElementById("phTag").textContent="PRACTICE";
    document.getElementById("phSub").textContent="15問 ・ No."+first+"–"+last;
  }else{
    document.getElementById("phBig").textContent="CHALLENGE "+(p.idx+1);
    document.getElementById("phTag").textContent="CHALLENGE SESSION";
    document.getElementById("phSub").textContent="100問 ・ No."+first+"–"+last+" ・ 全300語ぶっ通し";
  }

  // pager active
  document.querySelectorAll("#pager button").forEach(b=>b.classList.toggle("on", +b.dataset.gi===cur));

  // grid
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  st.order.forEach((origIdx, displayPos)=>{
    const it=p.items[origIdx];
    const card=document.createElement("div"); card.className="card";
    const ans = st.answered[origIdx];
    card.innerHTML =
      '<div class="top"><span class="qno">Q'+(displayPos+1)+' / No.'+it.n+'</span>'+
      '<div class="word">'+escapeHtml(it.w)+'</div>'+
      '<div class="ipa">'+escapeHtml(it.p||"")+'</div></div>'+
      '<div class="opts"></div>';
    const optsWrap=card.querySelector(".opts");
    const letters=["A","B","C","D"];
    st.opts[origIdx].forEach((optText,oi)=>{
      const btn=document.createElement("button");
      btn.className="opt"; btn.disabled = !!ans;
      btn.innerHTML='<span class="mk">'+letters[oi]+'</span>'+escapeHtml(optText);
      if(ans){
        if(optText===it.a) btn.classList.add("correct");
        else if(optText===ans.picked) btn.classList.add("wrong");
      }
      btn.onclick=(e)=>answer(p,origIdx,optText,e.currentTarget);
      optsWrap.appendChild(btn);
    });
    grid.appendChild(card);
  });
  updateScore();
  window.scrollTo({top:0});
  document.getElementById("prev").disabled = cur===0;
  document.getElementById("next").disabled = cur===PAGES.length-1;
}

function answer(p,origIdx,picked,btnEl){
  const st=state[key(p)];
  if(st.answered[origIdx]) return;
  const correct = p.items[origIdx].a;
  st.answered[origIdx]={picked, ok:picked===correct};
  if(picked===correct) st.correctCount++;
  // update just this card's buttons in place (no re-render, no scroll jump)
  const wrap = btnEl.closest(".opts");
  const btns = wrap.querySelectorAll(".opt");
  btns.forEach((b,i)=>{
    b.disabled = true;
    const txt = st.opts[origIdx][i];
    if(txt===correct) b.classList.add("correct");
    else if(b===btnEl) b.classList.add("wrong");
  });
  updateScore();
}

function updateScore(){
  // global tally across all visited pages
  let c=0,a=0;
  Object.values(state).forEach(s=>{c+=s.correctCount; a+=Object.keys(s.answered).length;});
  document.getElementById("sCorrect").textContent=c;
  document.getElementById("sAns").textContent=a;
  // page meter
  const st=state[key(PAGES[cur])];
  const done=Object.keys(st.answered).length;
  const pct=Math.round(done/st.total*100);
  document.getElementById("meter").style.width=pct+"%";
  document.getElementById("pct").textContent=pct+"%";
}

function escapeHtml(s){return (s+"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}

document.getElementById("reshuffle").onclick=()=>{ buildState(PAGES[cur]); render(); };
document.getElementById("prev").onclick=()=>{ if(cur>0){cur--;render();} };
document.getElementById("next").onclick=()=>{ if(cur<PAGES.length-1){cur++;render();} };

buildPager();
render();
</script>
