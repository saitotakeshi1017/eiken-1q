<!DOCTYPE html>

<head>

<title>The Enlightenment Public Sphere Mastery Quiz</title>
<style>
  :root {
    --bg:        #F5EFE0;
    --bg-soft:   #EDE4D0;
    --card:      #FBF7EC;
    --ink:       #2E3A3A;
    --muted:     #6B7775;
    --accent:    #5B8A8A;
    --accent-d:  #406A6A;
    --good:      #7BA77B;
    --good-bg:   #DFEBDC;
    --bad:       #B8746B;
    --bad-bg:    #EFD9D3;
    --hi:        #E8C97A;
    --line:      #d8cfba;
    --shadow:    0 2px 0 rgba(46,58,58,0.08), 0 6px 18px rgba(46,58,58,0.06);
    --radius:    14px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height:1.55; min-height:100vh; display:flex; justify-content:center;
    padding:24px 14px 60px;
  }
  .wrap { width:100%; max-width:860px; }
  header { text-align:center; margin-bottom:18px; }
  header h1 { font-size:1.45rem; margin:0 0 4px; color:var(--accent-d); letter-spacing:.3px; }
  header p { margin:0; color:var(--muted); font-size:.9rem; }
  .top-quiz-timer { display:flex; justify-content:flex-end; align-items:center; margin:0 0 10px; min-height:34px; }
  .data-store { display:none; }
  .jump { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 12px; justify-content:center; }
  .jump button { background:var(--card); color:var(--accent-d); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-weight:700; cursor:pointer; min-width:34px; }
  .jump button.current { background:var(--accent); color:#fff; border-color:var(--accent-d); }
  .jump button.done { background:var(--good-bg); border-color:var(--good); }
  .jump button.miss { background:var(--bad-bg); border-color:var(--bad); }
  .progress-track { width:100%; height:6px; background:var(--bg-soft); border-radius:999px; overflow:hidden; margin-bottom:16px; }
  .progress-fill { height:100%; background:var(--accent); width:0%; transition:width .3s ease; }
  .card { background:var(--card); border-radius:var(--radius); padding:24px 22px 20px; box-shadow:var(--shadow); }
  .qnum { font-size:.75rem; letter-spacing:1.2px; color:var(--accent); text-transform:uppercase; margin-bottom:6px; font-weight:600; }
  .qtype-tag { display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px; background:var(--hi); color:#6b4f1a; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .qtext { font-size:1.08rem; margin:4px 0 16px; color:var(--ink); }
  .source { font-size:.78rem; color:var(--muted); margin-top:-8px; margin-bottom:14px; }
  code { background:var(--hi); padding:1px 6px; border-radius:4px; font-family:"SF Mono", Menlo, Consolas, monospace; font-size:.92em; }
  .options { display:grid; gap:9px; }
  .opt {
    text-align:left; background:#FFFDF6; border:1.5px solid var(--line); color:var(--ink);
    padding:11px 13px; border-radius:10px; font-size:.96rem; cursor:pointer;
    transition:all .15s ease; font-family:inherit; line-height:1.45; width:100%;
    display:flex; align-items:center; white-space:normal; overflow:hidden;
  }
  .opt:hover:not(:disabled) { border-color:var(--accent); background:#FFFEFA; transform:translateY(-1px); }
  .opt:disabled { cursor:default; }
  .opt.correct, .opt.reveal { background:var(--good-bg); border-color:var(--good); color:#2f4a2f; }
  .opt.wrong { background:var(--bad-bg); border-color:var(--bad); color:#5a2c26; }
  .marker { display:inline-block; width:22px; height:22px; line-height:22px; border-radius:50%; background:var(--bg-soft); color:var(--muted); text-align:center; font-size:.78rem; margin-right:10px; font-weight:700; flex:0 0 auto; }
  .opt.correct .marker, .opt.reveal .marker { background:var(--good); color:white; }
  .opt.wrong .marker { background:var(--bad); color:white; }
  .optText { display:inline-block; }
  .small { color:var(--muted); font-size:.84rem; }

  .select-match { display:flex; flex-direction:column; gap:10px; }
  .select-row { display:grid; grid-template-columns:minmax(170px, 34%) 1fr; gap:10px; align-items:center; background:#FFFDF6; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; }
  .select-term { font-weight:700; color:var(--accent-d); font-size:.94rem; }
  .select-row select { width:100%; font:inherit; color:var(--ink); background:white; border:1.5px solid var(--line); border-radius:9px; padding:8px 10px; cursor:pointer; }
  .select-row.correct { background:var(--good-bg); border-color:var(--good); }
  .select-row.wrong { background:var(--bad-bg); border-color:var(--bad); }
  .select-row.correct select { border-color:var(--good); background:#f7fff4; color:#2f4a2f; }
  .select-row.wrong select { border-color:var(--bad); background:#fff6f3; color:#5a2c26; }
  .select-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:13px; }
  .dd-hint { font-size:.85rem; color:var(--accent-d); margin-bottom:14px; padding:8px 12px; background:rgba(91,138,138,.08); border-radius:8px; border-left:3px solid var(--accent); }
  .dd-card { background:var(--card); border:1.5px solid var(--accent); color:var(--accent-d); padding:7px 12px; border-radius:8px; font-size:.9rem; cursor:pointer; font-weight:500; user-select:none; transition:all .15s ease; font-family:inherit; line-height:1.4; text-align:left; }
  .dd-card:hover:not(:disabled) { background:#fff; }
  .dd-card.selected { background:var(--accent); color:white; transform:scale(1.04); box-shadow:0 0 0 3px rgba(91,138,138,.25); }
  .dd-card.correct { background:var(--good-bg); border-color:var(--good); color:#2f4a2f; cursor:default; }
  .dd-card.wrong { background:var(--bad-bg); border-color:var(--bad); color:#5a2c26; cursor:default; }
  .slot-target { border:2px dashed var(--line); border-radius:8px; background:var(--bg-soft); padding:5px; min-height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .15s ease; }
  .slot-target:hover { border-color:var(--accent); }
  .slot-target.has-card { border-style:solid; background:#fbf3df; padding:4px; }
  .slot-target.correct { border-color:var(--good); background:var(--good-bg); border-style:solid; }
  .slot-target.wrong { border-color:var(--bad); background:var(--bad-bg); border-style:solid; }
  .slot-target .placeholder { color:var(--muted); font-size:.82rem; }
  .slot-target .dd-card { width:100%; }
  .match-list, .order-list { display:flex; flex-direction:column; gap:8px; }
  .match-row { display:flex; align-items:center; gap:10px; }
  .match-label { flex:1; font-size:.9rem; color:var(--ink); }
  .match-row .slot-target { width:320px; flex:none; }
  .order-row { display:flex; align-items:stretch; gap:10px; }
  .order-num { width:34px; min-height:44px; border-radius:8px; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-size:1rem; }
  .order-row .slot-target { flex:1; }
  .card-bank { margin-top:14px; padding:11px 12px; background:var(--bg-soft); border-radius:10px; border:1px solid var(--line); }
  .card-bank-label { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; font-weight:600; }
  .card-bank-cards { display:flex; flex-wrap:wrap; gap:6px; min-height:30px; }
  .fillbox { display:grid; gap:10px; }
  .fill-row { background:#FFFDF6; border:1.5px solid var(--line); border-radius:10px; padding:12px 13px; font-size:.96rem; }
  .fill-row input { font:inherit; font-weight:600; color:var(--ink); padding:6px 8px; margin:0 4px; border-radius:8px; border:1.5px solid var(--line); background:#fff; min-width:170px; max-width:100%; }
  .fill-row input.correct { background:var(--good-bg); border-color:var(--good); color:#2f4a2f; }
  .feedback { margin-top:14px; padding:11px 13px; border-radius:10px; font-size:.92rem; display:none; line-height:1.5; }
  .feedback.good { background:var(--good-bg); color:#2f4a2f; display:block; }
  .feedback.bad { background:var(--bad-bg); color:#5a2c26; display:block; }
  .feedback.info { background:var(--bg-soft); color:var(--ink); display:block; }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button.btn { background:var(--accent); color:#FBF7EC; border:none; padding:11px 18px; border-radius:10px; font-size:.96rem; font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s ease, transform .1s ease; }
  button.btn:hover { background:var(--accent-d); }
  button.btn:active { transform:translateY(1px); }
  button.btn.ghost { background:transparent; color:var(--accent-d); border:1.5px solid var(--accent); }
  button.btn.ghost:hover { background:var(--bg-soft); }
  button.btn.arrow { width:50px; padding:11px 0; font-size:1.2rem; line-height:1; }
  .result { text-align:center; padding:12px 6px 6px; }
  .result h2 { margin:0 0 6px; color:var(--accent-d); font-size:1.5rem; }
  .score-big { font-size:2.6rem; font-weight:700; color:var(--ink); margin:12px 0 4px; }
  footer { text-align:center; color:var(--muted); font-size:.78rem; margin-top:20px; }

  .hidden { display:none !important; }
  .opening { text-align:center; padding:28px 18px 24px; }
  .opening h2 { margin:0 0 8px; color:var(--accent-d); font-size:1.55rem; }
  .opening p { margin:8px auto; max-width:620px; color:var(--muted); }
  .opening .attempt-badge { display:inline-block; margin:14px 0 18px; background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:7px 14px; color:var(--ink); font-weight:700; }
  .opening-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .practice-message { margin:12px auto 0; max-width:520px; }
  .attempt-history { margin:18px auto 18px; max-width:620px; text-align:left; background:#FFFDF6; border:1.5px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:0 2px 0 rgba(46,58,58,0.04); }
  .attempt-history h3 { margin:0 0 10px; color:var(--accent-d); font-size:1rem; }
  .attempt-list { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  .attempt-list li { display:flex; justify-content:space-between; gap:10px; align-items:center; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:.9rem; }
  .attempt-list .attempt-meta { color:var(--muted); font-size:.8rem; }
  .attempt-list .attempt-score { color:var(--ink); font-weight:800; white-space:nowrap; }
  .submit-row { justify-content:space-between; align-items:center; }
  .submit-note { color:var(--muted); font-size:.84rem; }
  .timer-pill { position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:9px; min-width:104px; justify-content:center; background:linear-gradient(180deg, #FFFDF6, var(--card)); padding:7px 15px 8px 12px; border-radius:999px; border:1px solid var(--line); transition:background .35s ease, border-color .35s ease, color .35s ease, box-shadow .35s ease; font-weight:800; color:var(--accent-d); box-shadow:0 5px 16px rgba(46,58,58,0.07), inset 0 1px 0 rgba(255,255,255,.7); letter-spacing:.6px; }
  .stopwatch { position:relative; width:22px; height:22px; border:2px solid currentColor; border-radius:50%; flex:0 0 auto; opacity:.9; box-shadow:inset 0 0 0 2px rgba(255,255,255,.45); }
  .stopwatch::before { content:""; position:absolute; width:8px; height:4px; border-radius:4px 4px 2px 2px; background:currentColor; left:50%; top:-7px; transform:translateX(-50%); opacity:.82; }
  .stopwatch::after { content:""; position:absolute; width:5px; height:3px; border-radius:4px; background:currentColor; right:-5px; top:1px; transform:rotate(38deg); opacity:.65; }
  .stopwatch-hand { position:absolute; left:50%; top:50%; width:2px; height:7px; border-radius:999px; background:currentColor; transform-origin:50% 100%; transform:translate(-50%, -100%) rotate(0deg); }
  .timer-pill.running .stopwatch-hand { animation:stopwatchTick 900s linear forwards; }
  .stopwatch-hand::after { content:""; position:absolute; left:50%; bottom:-3px; width:4px; height:4px; border-radius:50%; background:currentColor; transform:translateX(-50%); }
  .timer-pill.warning { background:linear-gradient(180deg, #fff8f2, var(--bad-bg)); border-color:var(--bad); color:#5a2c26; }
  .timer-pill.warning .stopwatch { opacity:1; }
  .timer-pill.urgent { box-shadow:0 0 0 3px rgba(255,80,80,.14), 0 5px 16px rgba(46,58,58,0.07); }
  .loading-screen { display:flex; align-items:center; justify-content:center; padding:12px 0; min-height:240px; background:transparent; }
  .loading-panel { width:min(100%, 460px); margin:0 auto; background:linear-gradient(180deg, #FFFDF6 0%, var(--card) 100%); color:var(--ink); border:1.5px solid var(--line); border-radius:18px; padding:26px 18px 22px; box-shadow:0 10px 28px rgba(46,58,58,.08), inset 0 1px 0 rgba(255,255,255,.6); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .loading-title { font-size:1.35rem; font-weight:700; margin:16px 0 8px; letter-spacing:.2px; color:var(--accent-d); text-align:center; }
  .loading-sub { color:var(--muted); font-size:.92rem; text-align:center; max-width:360px; line-height:1.6; }
  .loading-mini { margin-top:10px; color:var(--muted); font-size:.8rem; text-align:center; }
  .wait-orb { position:relative; width:108px; height:108px; }
  .wait-core { position:absolute; inset:38px; border-radius:50%; background:linear-gradient(180deg, var(--card), #fff); border:1px solid var(--line); box-shadow:inset 0 2px 8px rgba(46,58,58,.06); }
  .wait-ring { position:absolute; border-radius:50%; border:4px solid transparent; }
  .wait-ring.ring-a { inset:0; border-top-color:var(--accent); border-right-color:#82AAA6; animation:spinRing 1s linear infinite; }
  .wait-ring.ring-b { inset:12px; border-bottom-color:var(--hi); border-left-color:#9BBDB5; animation:spinRingReverse 1.35s linear infinite; }
  .wait-dot { position:absolute; width:12px; height:12px; border-radius:50%; background:#E8C97A; top:10px; left:calc(50% - 6px); box-shadow:0 0 0 5px rgba(232,201,122,.14); animation:dotPulse 1.2s ease-in-out infinite; }
  @keyframes spinRing { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes spinRingReverse { from { transform:rotate(360deg); } to { transform:rotate(0deg); } }
  @keyframes dotPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(.82); opacity:.75; } }
  .guard-toast { position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-10px); opacity:0; pointer-events:none; z-index:9999; background:linear-gradient(180deg, #FFFDF6, var(--card)); color:var(--accent-d); border:1.5px solid var(--line); border-radius:999px; padding:9px 15px; box-shadow:0 10px 26px rgba(46,58,58,.12); font-size:.9rem; font-weight:700; transition:opacity .18s ease, transform .18s ease; }
  .guard-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  @keyframes stopwatchTick { from { transform:translate(-50%, -100%) rotate(0deg); } to { transform:translate(-50%, -100%) rotate(360deg); } }
  @media (max-width: 560px) {
    body { padding:14px 10px 40px; }
    .card { padding:20px 16px 18px; }
    .qtext { font-size:1rem; }
    header h1 { font-size:1.25rem; }
    .match-row { flex-direction:column; align-items:stretch; gap:4px; }
    .select-row { grid-template-columns:1fr; gap:6px; }
    .match-row .slot-target { width:100%; }
    .fill-row input { width:100%; margin:8px 0 0; }
    .loading-panel { padding:22px 14px 18px; }
    .wait-orb { width:92px; height:92px; }
    .wait-core { inset:32px; }
    .loading-title { font-size:1.2rem; }
    .timer-pill { min-width:98px; padding-right:13px; }
    .stopwatch { width:20px; height:20px; }
  }
</style>
</head>

    <span class="timer-pill" id="timerPill"><span class="stopwatch" aria-hidden="true"><span class="stopwatch-hand"></span></span><strong id="timer">15:00</strong></span>

<script>
const BANK = [{"id":"q01","type":"mcq","title":"Lecture title","source":"Slide 1","prompt":"What is the title and core topic of this slide set?","options":[{"text":"The Enlightenment: the public sphere","correct":true},{"text":"The Enlightenment: private belief and monarchy","correct":false},{"text":"Early modern transport and electric media","correct":false},{"text":"The Renaissance: manuscript culture only","correct":false}],"explanation":"The title slide names the topic as The Enlightenment: the public sphere. The whole quiz follows that thread: how media, print, debate, conflict, and Enlightenment networks shaped public communication."},{"id":"q02","type":"matching","title":"Presentation and reading frame","source":"Slide 3","prompt":"Match each item from the presentation slide to what it asks you to remember.","pairs":[{"left":"Presentation C","right":"the assigned presentation section for this class"},{"left":"The free networks of Enlightenment","right":"one focus from Stjernfelt & Lauritzen"},{"left":"A new golden age of Enlightenment?","right":"another focus from Stjernfelt & Lauritzen"},{"left":"Your post has been removed","right":"the book subtitle about tech giants and freedom of speech"}],"explanation":"Slide 3 frames the class through Presentation C and Stjernfelt & Lauritzen's 2020 book, Your post has been removed: Tech giants and freedom of speech."},{"id":"q03","type":"mcq","title":"Early modern Europe period","source":"Slide 4","prompt":"Which period does the slide associate with early modern Europe and the public sphere?","options":[{"text":"1450s-1790s","correct":true},{"text":"1200s-1300s","correct":false},{"text":"1830s-1900s","correct":false},{"text":"1914-1945","correct":false}],"explanation":"Slide 4 gives early modern Europe as 1450s-1790s. That range links print culture, Reformation conflict, political crises, Enlightenment networks, and the emergence of public sphere(s)."},{"id":"q04","type":"matching","title":"Habermas and media perspective","source":"Slide 4","prompt":"Match each theoretical angle to its claim about the public sphere.","pairs":[{"left":"Jürgen Habermas","right":"argued that a public sphere was formed in 18th-century Europe"},{"left":"The Structural Transformation of the Public Sphere","right":"Habermas' 1962 work"},{"left":"Media perspective","right":"public spheres formed more slowly and complexly"},{"left":"Plural public spheres","right":"the formation was not a single simple event"}],"explanation":"The slide first names Habermas' 1962 argument, then complicates it through a media perspective: the formation of public spheres was slower, plural, and more complex."},{"id":"q05","type":"matching","title":"Three engines of public spheres","source":"Slide 4","prompt":"Match each formation factor to the role it plays in early modern public spheres.","pairs":[{"left":"Print culture","right":"expanded access to information and literacy"},{"left":"Religious conflict","right":"politicized public communication"},{"left":"Political crises","right":"turned media debate into participation and struggle"},{"left":"Free debate vs. control","right":"appeared through censorship, propaganda, and argument"}],"explanation":"The slide condenses the formation of public spheres into print culture, religious conflict, and political crises. These did not simply create harmony; they produced debate, censorship, propaganda, participation, and public opinion."},{"id":"q06","type":"mcq","title":"Print and literacy","source":"Slide 4","prompt":"According to the slide, what did print expand?","options":[{"text":"Access to information and, consequently, literacy","correct":true},{"text":"Only clerical secrecy and Latin monopoly","correct":false},{"text":"Only private handwritten communication","correct":false},{"text":"A complete end to propaganda","correct":false}],"explanation":"Print expanded access to information and, consequently, literacy. This is one reason media history matters to the public sphere: more circulation creates more possible publics."},{"id":"q07","type":"mcq","title":"Religious conflict and communication","source":"Slide 4","prompt":"What did religious conflict do to communication?","options":[{"text":"It politicized public communication","correct":true},{"text":"It removed politics from communication","correct":false},{"text":"It ended the need for print","correct":false},{"text":"It made debate permanently private","correct":false}],"explanation":"The slide says religious conflict politicized public communication. Debate about religion became a struggle over authority, publics, institutions, and power."},{"id":"q08","type":"matching","title":"Debate, propaganda, and public opinion","source":"Slide 4","prompt":"Match each public-sphere concept to the exact lecture emphasis.","pairs":[{"left":"Censorship","right":"one side of controlled public communication"},{"left":"Propaganda","right":"media used to influence publics"},{"left":"Free debate","right":"the competing ideal against censorship and propaganda"},{"left":"Public opinion","right":"something that can be weaponized"},{"left":"Temporary debates","right":"can lead to enduring critical culture"}],"explanation":"The slide refuses a simple happy story. Public opinion can be weaponized, and censorship and propaganda exist beside free debate. Yet temporary debates can still lead toward enduring critical culture."},{"id":"q09","type":"mcq","title":"Political participation through media","source":"Slide 4","prompt":"Which phrase captures how people could participate politically in this media history?","options":[{"text":"Political participation through media","correct":true},{"text":"Political participation only through royal courts","correct":false},{"text":"Political participation without communication","correct":false},{"text":"Political participation only through private diaries","correct":false}],"explanation":"The slide explicitly names political participation through media. Publicness becomes a media process: argument, circulation, persuasion, and organized communication."},{"id":"q10","type":"matching","title":"Enlightenment media networks","source":"Slide 4","prompt":"Match each Enlightenment media-network item to its definition or example.","pairs":[{"left":"Republic of Letters","right":"long-distance intellectual community"},{"left":"Late 17th-18th century","right":"period associated with the Republic of Letters"},{"left":"French Academy","right":"example of a founded academy"},{"left":"Royal Society","right":"another example of a founded academy"}],"explanation":"The slide treats Enlightenment media networks as institutions and communities: the Republic of Letters and academies such as the French Academy and the Royal Society."},{"id":"q11","type":"sequence","title":"Formation timeline","source":"Slide 5","prompt":"Arrange the formation of public sphere(s) in the order given by the slide.","items":["Pre-print independent Renaissance cities developed political culture.","Print around 1450 enabled reproducibility of texts and scaling.","Starting in the 1520s, the Protestant Reformation began large-scale religious debate.","Religious wars in the 16th century turned print into a political weapon.","Further political crises in the 17th and 18th centuries created media wars."],"explanation":"Slide 5 gives a layered chronology: Renaissance city political culture first, then print scaling, then Reformation debate, then religious wars, then English and French political crises as media wars."},{"id":"q12","type":"mcq","title":"Pre-print political culture","source":"Slide 5","prompt":"Before print, where does the slide locate important political culture?","options":[{"text":"Independent Renaissance cities such as Florence and Venice","correct":true},{"text":"Only centralized modern nation-states","correct":false},{"text":"Only radio broadcasting institutions","correct":false},{"text":"Only 20th-century social media platforms","correct":false}],"explanation":"The slide says to remember pre-print independent Renaissance cities, especially Florence and Venice. Public-sphere formation did not begin from nothing in 1450."},{"id":"q13","type":"mcq","title":"Print's basic contribution","source":"Slide 5","prompt":"What did print around 1450 make possible in the slide's formation story?","options":[{"text":"Reproducibility of texts and scaling","correct":true},{"text":"The end of religious disagreement","correct":false},{"text":"The invention of the French Revolution","correct":false},{"text":"The disappearance of political crisis","correct":false}],"explanation":"Print is summarized as reproducibility of texts and scaling. Those two words are tiny hinges with heavy doors: texts can be copied, circulated, and used to build wider publics."},{"id":"q14","type":"matching","title":"Martin Luther and Reformation print","source":"Slide 5","prompt":"Match each Luther/Reformation detail to its slide meaning.","pairs":[{"left":"Martin Luther","right":"1483-1546"},{"left":"Vernacular Bible translation","right":"challenged Church authority by widening access"},{"left":"Pamphlets and print propaganda","right":"tools used to challenge Church authority"},{"left":"Starting the 1520s","right":"period when the Protestant Reformation begins in this slide"}],"explanation":"The slide connects Luther, vernacular translation, pamphlets, and propaganda. Reformation communication was not merely theological; it was a media event that challenged institutional authority."},{"id":"q15","type":"matching","title":"Reformation effects","source":"Slide 5","prompt":"Match each effect of the Protestant Reformation to the correct explanation.","pairs":[{"left":"First large-scale public debates","right":"religious controversy became broadly circulated"},{"left":"Weakened clerical monopoly","right":"the Church lost exclusive control over religious interpretation"},{"left":"Lay individuals","right":"were encouraged to interpret religious texts"},{"left":"Vernacular language","right":"made religious texts accessible beyond Latin elites"}],"explanation":"The slide says the Reformation helped produce first large-scale public debates, weakened clerical monopoly, and encouraged lay interpretation of religious texts."},{"id":"q16","type":"matching","title":"Religious wars and media weapons","source":"Slide 5","prompt":"Match each religious-war item to the lecture emphasis.","pairs":[{"left":"16th-century religious wars","right":"period when print became a political weapon"},{"left":"Germany","right":"one place named in this media-politics process"},{"left":"France","right":"another place named in this media-politics process"},{"left":"Netherlands","right":"another place named in this media-politics process"}],"explanation":"The slide names Germany, France, and the Netherlands as places where print was turned into a political weapon during 16th-century religious wars."},{"id":"q17","type":"matching","title":"New print media forms","source":"Slide 5","prompt":"Match each new type of print media to the category the slide wants you to memorize.","pairs":[{"left":"Pamphlets","right":"short polemical or informational print texts"},{"left":"Broadsheets","right":"single-sheet public print format"},{"left":"Sermons and songs","right":"religious and popular forms circulated through print"},{"left":"Posters and satirical images","right":"visual and public-facing media weapons"}],"explanation":"Slide 5 lists pamphlets, broadsheets, sermons, songs, posters, and satirical images. Public communication is not only books; it is a whole battlefield of formats."},{"id":"q18","type":"mcq","title":"Institutionalizing public opinion","source":"Slide 5","prompt":"What did religious conflicts ironically help institutionalize?","options":[{"text":"Political communication and public opinion","correct":true},{"text":"Only private manuscript copying","correct":false},{"text":"A complete ban on media wars","correct":false},{"text":"The disappearance of censorship","correct":false}],"explanation":"The slide says religious conflicts ironically led to institutionalizing political communication and public opinion. Conflict accidentally helped build the machinery of publicness."},{"id":"q19","type":"mcq","title":"Counter-Reformation censorship","source":"Slide 5","prompt":"How does the slide describe Counter-Reformation censorship?","options":[{"text":"Censorship from both sides","correct":true},{"text":"Censorship only by Protestants","correct":false},{"text":"Censorship only by secular republics","correct":false},{"text":"No censorship at all","correct":false}],"explanation":"The slide says Counter-Reformation: censorship from both sides. The public sphere emerges inside control and counter-control, not in a pure meadow of free speech."},{"id":"q20","type":"matching","title":"Political crises as media wars","source":"Slide 5","prompt":"Match each political crisis to its date or description.","pairs":[{"left":"English Civil War","right":"1640s"},{"left":"Glorious Revolution","right":"1688"},{"left":"French Revolution","right":"1789"},{"left":"Further political crises","right":"became media wars"}],"explanation":"Slide 5 lists the English Civil War, Glorious Revolution, and French Revolution as later political crises in which media wars matter."},{"id":"q21","type":"mcq","title":"Enlightenment definition","source":"Slide 6","prompt":"What is the Enlightenment, according to the slide?","options":[{"text":"A movement to empower individuals through rational thought","correct":true},{"text":"A movement to restore clerical monopoly over interpretation","correct":false},{"text":"A rejection of knowledge and public debate","correct":false},{"text":"A purely private literary style with no political meaning","correct":false}],"explanation":"The slide defines the Enlightenment as a movement to empower individuals through rational thought. Societies can be improved through knowledge, and that requires free public debate."},{"id":"q22","type":"fill","title":"Enlightenment formula","source":"Slide 6","prompt":"Fill in the Enlightenment logic from the slide. Spelling matters less than meaning, tiny reason-goblin 🧠.","sentences":[{"before":"Societies can be improved through ","after":".","answers":["knowledge","Knowledge"]},{"before":"That improvement requires free public ","after":".","answers":["debate","Debate"]}],"explanation":"The slide's Enlightenment logic is compact: rational thought empowers individuals; societies improve through knowledge; knowledge needs free public debate."},{"id":"q23","type":"matching","title":"Spinoza and expression","source":"Slide 6","prompt":"Match each Spinoza detail to the correct point.","pairs":[{"left":"Baruch Spinoza","right":"earliest call for freedom of expression"},{"left":"1670","right":"date attached to Spinoza in the slide"},{"left":"Actions","right":"should be governed by legislators"},{"left":"Views and expressions","right":"should not be governed in the same way"}],"explanation":"The slide cites Spinoza as an early call for freedom of expression in 1670. The quoted point is political: distinguish actions from views and expressions."},{"id":"q24","type":"matching","title":"Spinoza quote logic","source":"Slide 6","prompt":"Match each part of the Spinoza quotation to its meaning.","pairs":[{"left":"Distinguish actions from views","right":"the basic political distinction"},{"left":"Legislators govern actions","right":"conduct can be legally regulated"},{"left":"Views and expressions not governed that way","right":"speech and belief need freedom"},{"left":"More free and peaceful society","right":"the expected result"},{"left":"Influence the laws","right":"people may respect laws more when they can shape them"}],"explanation":"The quote argues that regulating actions while protecting views and expressions creates a freer and more peaceful society. If people can influence laws, they may respect them more."},{"id":"q25","type":"matching","title":"Enlightenment thinkers","source":"Slide 6","prompt":"Match each Enlightenment figure to the detail on the slide.","pairs":[{"left":"Voltaire","right":"1694-1778"},{"left":"Jean-Jacques Rousseau","right":"1712-1778; society and social contract"},{"left":"Denis Diderot","right":"1713-1784"},{"left":"Late 17th century","right":"starting point for the Enlightenment section"}],"explanation":"Slide 6 names Voltaire, Rousseau, and Diderot, and says the Enlightenment begins starting with the late 17th century. Rousseau is tied to society and the social contract."},{"id":"q26","type":"matching","title":"Enlightenment values and media forms","source":"Slide 6","prompt":"Match each Enlightenment value or print form to its role.","pairs":[{"left":"Rights and liberties","right":"core Enlightenment political values"},{"left":"Religious tolerance","right":"opposes religious coercion and persecution"},{"left":"Critical thinking","right":"challenges authority"},{"left":"Books, journals, Encyclopedias, reviews","right":"print forms that made Enlightenment debate possible"},{"left":"Republic of Letters","right":"new media network of Enlightenment"}],"explanation":"The slide ties Enlightenment values to media. Rights, liberties, tolerance, and critical thinking became possible through print forms such as books, journals, Encyclopedias, and reviews, plus networks like the Republic of Letters."},{"id":"q27","type":"matching","title":"Next class preparation","source":"Slide 7","prompt":"Match each next-class item to the correct detail.","pairs":[{"left":"Reading","right":"Subchapters 1.1 and 1.2"},{"left":"Pages","right":"21-38"},{"left":"Friedrich Kittler, 1986","right":"Gramophone, Film, Typewriter"},{"left":"Presentation D","right":"Chapter I.1 in Gitelman (2006) - New media publics"}],"explanation":"Slide 7 assigns Kittler's Gramophone, Film, Typewriter, subchapters 1.1 and 1.2, pages 21-38, and Presentation D on Gitelman's Chapter I.1, New media publics."},{"id":"q28","type":"matching","title":"Whole-slide synthesis","source":"Whole slide deck","prompt":"Final boss: match each big claim to the best example from this slide set. This is the public-sphere armor plating 🛡️.","pairs":[{"left":"Public spheres formed gradually","right":"media perspective complicates Habermas' 18th-century model"},{"left":"Print scales debate","right":"1450 reproducibility plus pamphlets, broadsheets, posters, and images"},{"left":"Conflict creates publicness","right":"Reformation, religious wars, censorship, propaganda, and media wars"},{"left":"Enlightenment needs open discussion","right":"knowledge, rational thought, and free public debate"},{"left":"Media networks sustain intellectual life","right":"Republic of Letters, academies, journals, Encyclopedias, and reviews"}],"explanation":"The whole deck says public sphere(s) are not born from one clean moment. They form through print, conflict, institutions, censorship, propaganda, debate, Enlightenment values, and networks."}];
let order = [], pos = 0, score = 0, round = 1, answered = false;
let states = {};
const QUIZ_SECONDS = 15 * 60;
let remainingSeconds = QUIZ_SECONDS;
let timerHandle = null;
let attemptSubmitted = false;
let currentAttemptRecord = null;
let navigationGuardActive = false;
let guardToastTimer = null;
let attemptDeadlineTs = null;
let restoringActiveAttempt = false;
let practiceMode = false;
let dragState = { selected:null, placements:{} };
let currentDD = null;
const STORE_PREFIX = 'enlightenment_public_sphere_mastery_v1_';
const elCard = document.getElementById('card'), elQIdx = document.getElementById('qIdx'), elQTotal = document.getElementById('qTotal'), elScore = document.getElementById('score'), elRound = document.getElementById('round'), elBest = document.getElementById('best'), elCompleted = document.getElementById('completed'), elProg = document.getElementById('progress'), elJump = document.getElementById('jump'), elQuizBar = document.getElementById('quizBar'), elProgressTrack = document.getElementById('progressTrack'), elTimer = document.getElementById('timer'), elTimerPill = document.getElementById('timerPill');
elQTotal.textContent = BANK.length;
function shuffle(arr) { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s) { return String(s||'').toLowerCase().replace(/[.,;:!?()[\]{}"']/g,'').replace(/[-‐‑‒–—]/g,' ').replace(/\s+/g,' ').trim(); }
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k,v) { try { localStorage.setItem(k,v); } catch(e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch(e) {} }

function showGuardToast(message='Quiz attempt protected. Finish or submit this attempt first.') {
  let toast = document.getElementById('guardToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'guardToast';
    toast.className = 'guard-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.add('show');
  if(guardToastTimer) clearTimeout(guardToastTimer);
  guardToastTimer = setTimeout(()=>toast.classList.remove('show'), 2200);
}
function pushGuardState() {
  try { history.pushState({quizAttemptGuard:true, t:Date.now()}, '', location.href); } catch(e) {}
}
function enableNavigationGuard() {
  navigationGuardActive = true;
  pushGuardState();
  pushGuardState();
}
function disableNavigationGuard() {
  navigationGuardActive = false;
}
function getActiveAttempt() {
  try { return JSON.parse(lsGet(STORE_PREFIX+'activeAttempt') || 'null'); } catch(e) { return null; }
}
function saveActiveAttempt() {
  if(!navigationGuardActive || attemptSubmitted || !order.length) return;
  const active = {
    active:true,
    order:order.slice(),
    pos,
    score,
    round,
    states,
    remainingSeconds:Math.max(0, remainingSeconds),
    deadlineTs:attemptDeadlineTs,
    savedAt:Date.now()
  };
  lsSet(STORE_PREFIX+'activeAttempt', JSON.stringify(active));
}
function clearActiveAttempt() { lsDel(STORE_PREFIX+'activeAttempt'); }
window.addEventListener('beforeunload', function(e) {
  if(navigationGuardActive && !attemptSubmitted){
    saveActiveAttempt();
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
window.addEventListener('pagehide', function() {
  if(navigationGuardActive && !attemptSubmitted) saveActiveAttempt();
});
window.addEventListener('popstate', function(e) {
  if(navigationGuardActive && !attemptSubmitted){
    pushGuardState();
    window.setTimeout(pushGuardState, 0);
    showGuardToast('Back/forward is blocked during this active quiz attempt.');
    saveActiveAttempt();
  }
});
function getAttemptHistory() { try { return JSON.parse(lsGet(STORE_PREFIX+'history') || '[]'); } catch(e) { return []; } }
function saveAttemptHistory(arr) { lsSet(STORE_PREFIX+'history', JSON.stringify(arr)); }
function getCompleted() { const history = getAttemptHistory(); if(history.length) return history.length; return parseInt(lsGet(STORE_PREFIX+'completed') || '0', 10); }
function appendAttemptRecord(record) { const history = getAttemptHistory(); history.push(record); saveAttemptHistory(history); lsSet(STORE_PREFIX+'completed', String(history.length)); return history.length; }
function formatAttemptDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString([], {year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  } catch(e) { return 'saved attempt'; }
}
function renderAttemptHistoryList(history) {
  if(!history.length) return '';
  const rows = history.map((a,i)=>{
    const pct = Math.round((a.score / a.total) * 100);
    const label = a.timeExpired ? 'auto-submitted, time up' : 'submitted';
    const wrongCount = Array.isArray(a.wrongIds) ? a.wrongIds.length : Math.max(0, (a.total || 0) - (a.score || 0));
    return `<li><span><strong>Attempt ${i+1}</strong><br><span class="attempt-meta">${escapeHTML(formatAttemptDate(a.submittedAt))} · ${label} · wrong marks: ${wrongCount}</span></span><span class="attempt-score">${a.score} / ${a.total} · ${pct}%</span></li>`;
  }).join('');
  return `<section class="attempt-history"><h3>Previous attempts</h3><ol class="attempt-list">${rows}</ol></section>`;
}
function updateSavedStats() { elBest.textContent = lsGet(STORE_PREFIX+'best') || '—'; elCompleted.textContent = String(getCompleted()); }
function formatTime(seconds) { const m=Math.floor(seconds/60); const s=seconds%60; return `${m}:${String(s).padStart(2,'0')}`; }
function mixRGB(a,b,t){ const m=(x,y)=>Math.round(x+(y-x)*t); return `rgb(${m(a[0],b[0])}, ${m(a[1],b[1])}, ${m(a[2],b[2])})`; }
function updateTimerDisplay() {
  const safeSeconds = Math.max(0, remainingSeconds);
  elTimer.textContent = formatTime(safeSeconds);
  elTimerPill.style.setProperty('--timer-progress', String(safeSeconds / QUIZ_SECONDS));
  elTimerPill.classList.remove('warning','urgent');
  elTimerPill.style.background='';
  elTimerPill.style.borderColor='';
  elTimerPill.style.color='';
  if (safeSeconds <= 10) {
    const t = (10 - safeSeconds) / 10;
    elTimerPill.classList.add('urgent');
    elTimerPill.style.background = mixRGB([255, 205, 205], [236, 169, 169], t);
    elTimerPill.style.borderColor = mixRGB([255, 95, 95], [204, 0, 0], t);
    elTimerPill.style.color = mixRGB([255, 40, 40], [170, 0, 0], t);
  } else if (safeSeconds <= 60) {
    elTimerPill.classList.add('warning');
  }
}
function stopTimer() { if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } elTimerPill.classList.remove('running'); }
function syncRemainingFromDeadline() {
  if(attemptDeadlineTs){
    remainingSeconds = Math.max(0, Math.ceil((attemptDeadlineTs - Date.now()) / 1000));
  }
}
function startTimer(reset=true) {
  stopTimer();
  if(reset || !attemptDeadlineTs){
    remainingSeconds = QUIZ_SECONDS;
    attemptDeadlineTs = Date.now() + QUIZ_SECONDS * 1000;
  } else {
    syncRemainingFromDeadline();
  }
  updateTimerDisplay();
  elTimerPill.classList.remove('running');
  void elTimerPill.offsetWidth;
  elTimerPill.classList.add('running');
  timerHandle = setInterval(()=>{
    syncRemainingFromDeadline();
    updateTimerDisplay();
    saveActiveAttempt();
    if(remainingSeconds <= 0){ stopTimer(); submitAttempt(true); }
  }, 1000);
}
function setQuizChrome(show) { elQuizBar.classList.toggle('hidden', !show); elJump.classList.toggle('hidden', !show); elProgressTrack.classList.toggle('hidden', !show); }
function showOpening(message='') {
  disableNavigationGuard();
  clearActiveAttempt();
  stopTimer();
  practiceMode = false;
  attemptDeadlineTs = null;
  remainingSeconds = QUIZ_SECONDS;
  updateTimerDisplay();
  attemptSubmitted = false;
  currentAttemptRecord = null;
  setQuizChrome(false);
  updateSavedStats();
  elQTotal.textContent = BANK.length;
  const history = getAttemptHistory();
  const historyList = renderAttemptHistoryList(history);
  const practiceButton = history.length ? `<button class="btn ghost" onclick="startIncorrectPractice()">Practice only the incorrect questions again</button>` : '';
  const messageBox = message ? `<div id="openingMsg" class="feedback info practice-message" style="display:block">${escapeHTML(message)}</div>` : `<div id="openingMsg" class="practice-message"></div>`;
  elCard.innerHTML = `<div class="opening"><h2>Ready to take the quiz?</h2><p>This round has ${BANK.length} questions and a 15-minute timer. Answer what you can, then press Submit to lock in the attempt. If time reaches 0, the quiz will submit automatically.</p><div class="attempt-badge">Completed attempts: <span id="openingCompleted">${getCompleted()}</span></div>${historyList}<div class="opening-actions"><button class="btn" onclick="startRound()">Take the quiz</button>${practiceButton}</div>${messageBox}</div>`;
}

function getLatestWrongQuestionIds() {
  const history = getAttemptHistory();
  if(!history.length) return [];
  const latest = history[history.length - 1];
  return Array.isArray(latest.wrongIds) ? latest.wrongIds : [];
}
function showOpeningMessage(message, type='info') {
  const box = document.getElementById('openingMsg');
  if(box){
    box.className = `feedback ${type} practice-message`;
    box.style.display = 'block';
    box.textContent = message;
  } else {
    showOpening(message);
  }
}
function startIncorrectPractice() {
  const wrongIds = getLatestWrongQuestionIds();
  if(!wrongIds.length){
    showOpeningMessage("You've got no wrong mark!", 'good');
    return;
  }
  const wrongIndexes = wrongIds.map(id => BANK.findIndex(q => q.id === id)).filter(i => i >= 0);
  if(!wrongIndexes.length){
    showOpeningMessage("You've got no wrong mark!", 'good');
    return;
  }
  disableNavigationGuard();
  clearActiveAttempt();
  stopTimer();
  practiceMode = true;
  attemptSubmitted = false;
  currentAttemptRecord = null;
  order = wrongIndexes;
  pos = 0;
  score = 0;
  states = {};
  elScore.textContent = '0';
  updateSavedStats();
  setQuizChrome(true);
  elQuizBar.classList.add('hidden');
  renderJump();
  renderQuestion();
}

function startRound() {
  practiceMode = false;
  setQuizChrome(true);
  order = shuffle(BANK.map((_,i)=>i));
  pos=0;
  score=0;
  states={};
  attemptSubmitted=false;
  currentAttemptRecord=null;
  round=getCompleted()+1;
  elScore.textContent='0';
  elRound.textContent=round;
  updateSavedStats();
  enableNavigationGuard();
  startTimer(true);
  saveActiveAttempt();
  renderJump();
  renderQuestion();
}
function restoreActiveAttempt(active) {
  restoringActiveAttempt = true;
  setQuizChrome(true);
  order = Array.isArray(active.order) && active.order.length ? active.order : shuffle(BANK.map((_,i)=>i));
  pos = Number.isInteger(active.pos) ? Math.max(0, Math.min(active.pos, order.length-1)) : 0;
  states = active.states || {};
  score = Object.values(states).filter(s=>s.answered&&s.correct).length;
  round = active.round || (getCompleted()+1);
  attemptSubmitted = false;
  currentAttemptRecord = null;
  attemptDeadlineTs = active.deadlineTs || (Date.now() + Math.max(0, active.remainingSeconds || QUIZ_SECONDS) * 1000);
  syncRemainingFromDeadline();
  elScore.textContent=score;
  elRound.textContent=round;
  updateSavedStats();
  enableNavigationGuard();
  startTimer(false);
  renderJump();
  renderQuestion();
  showGuardToast('Your ongoing attempt was restored and protected.');
  restoringActiveAttempt = false;
  if(remainingSeconds <= 0) submitAttempt(true);
}
function bootQuiz() {
  const active = getActiveAttempt();
  if(active && active.active && !active.submitted && Array.isArray(active.order) && active.order.length){
    restoreActiveAttempt(active);
  } else {
    showOpening();
  }
}
function renderJump() { elJump.innerHTML=''; order.forEach((qi,i)=>{ const q=BANK[qi]; const st=states[q.id]; const b=document.createElement('button'); b.textContent=i+1; b.className=(i===pos?'current ':'')+(st?.answered?(st.correct?'done':'miss'):''); b.onclick=()=>{pos=i; saveActiveAttempt(); renderQuestion();}; elJump.appendChild(b); }); }
function currentQ() { return BANK[order[pos]]; }
function lockedState(item){ return states[item.id]?.answered ? states[item.id] : null; }
function lockNotice(item){ const st=states[item.id]; if(!st?.answered) return; feedback((st.correct?'Correct. ':'Locked. ')+item.explanation, st.correct?'good':(st.revealed?'info':'bad')); }
function renderQuestion() {
  if(pos>=order.length) return renderResult();
  dragState={selected:null,placements:{}}; currentDD=null;
  const item=currentQ();
  answered=!!states[item.id]?.answered;
  elQIdx.textContent=pos+1; elQTotal.textContent=order.length; elProg.style.width=(pos/order.length*100)+'%';
  const tagMap={mcq:'Multiple Choice',matching:'Dropdown Match',sequence:'Tap & Order',fill:'Fill In'};
  let html=`<div class="qnum">Question ${pos+1} of ${order.length}<span class="qtype-tag">${tagMap[item.type]}</span></div><p class="qtext">${item.prompt}</p><div class="source">${escapeHTML(item.source)} · ${escapeHTML(item.title)}</div>`;
  if(item.type==='mcq') html+=renderMC_HTML(item); else if(item.type==='fill') html+=renderFill_HTML(item); else if(item.type==='matching') html+=renderSelectMatch_HTML(item); else html+=renderDD_HTML(item);
  const rightControls = practiceMode ? `<button class="btn ghost" onclick="showOpening()">Return to opening page</button>` : `<button class="btn" onclick="submitAttempt()">Submit</button>`;
  html += `<div class="feedback" id="fb"></div><div class="actions submit-row" id="acts"><div><button class="btn ghost arrow" onclick="prevQ()" aria-label="Previous question" title="Previous question">←</button> <button class="btn ghost arrow" onclick="nextQ()" aria-label="Next question" title="Next question">→</button>${item.type==='matching'?'':` <button class="btn ghost" onclick="showAnswer()" ${answered?'disabled':''}>Show answer</button>`}</div><div>${rightControls}</div></div>`;
  elCard.innerHTML=html;
  if(item.type==='mcq') attachMC(item); else if(item.type==='fill') attachFill(item); else if(item.type==='matching') attachSelectMatch(item); else attachDD(item);
  lockNotice(item);
  renderJump();
  saveActiveAttempt();
}
function renderMC_HTML(item) {
  const st=states[item.id];
  const idxs=st?.optionOrder || shuffle(item.options.map((_,i)=>i));
  item._shuf=idxs;
  return `<div class="options">${idxs.map((orig,i)=>`<button class="opt" data-i="${i}"><span class="marker">${String.fromCharCode(65+i)}</span><span class="optText">${escapeHTML(item.options[orig].text)}</span></button>`).join('')}</div><p class="small">Wrong choices are plausible exam traps. Read the wording slowly.</p>`;
}
function attachMC(item) {
  const st=states[item.id];
  if(st?.answered){
    document.querySelectorAll('.opt').forEach((b,k)=>{
      const orig=item._shuf[k];
      b.disabled=true;
      if(item.options[orig].correct) b.classList.add('reveal');
      if(st.selectedOrig===orig) b.classList.add(st.correct?'correct':'wrong');
    });
    return;
  }
  document.querySelectorAll('.opt').forEach(btn=>{ btn.onclick=()=>{ if(answered)return; answered=true; const shownIndex=+btn.dataset.i; const orig=item._shuf[shownIndex]; const ok=!!item.options[orig].correct; document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true; if(item.options[item._shuf[k]].correct)b.classList.add('reveal');}); btn.classList.add(ok?'correct':'wrong'); mark(ok,{selectedOrig:orig, optionOrder:item._shuf.slice()}); feedback((ok?'Correct. ':'Not quite. ')+item.explanation, ok?'good':'bad'); }; });
}
function renderFill_HTML(item) { return `<div class="fillbox">${item.sentences.map((s,i)=>`<label class="fill-row">${escapeHTML(s.before)}<input data-fill="${i}" autocomplete="off" autocapitalize="none" spellcheck="false" />${escapeHTML(s.after)}</label>`).join('')}</div><p class="small">Type the missing word or phrase. Correct blanks lock automatically.</p>`; }
function attachFill(item) {
  const st=states[item.id];
  const inputs=[...document.querySelectorAll('input[data-fill]')];
  if(st?.values){
    inputs.forEach((inp,i)=>{
      inp.value = st.values?.[i] || '';
      if(st.locked?.[i] || st.answered){ inp.classList.add('correct'); inp.disabled=true; }
    });
  }
  if(st?.answered){ return; }
  inputs.forEach(inp=>{ inp.addEventListener('input', checkFill); });
}
function checkFill() {
  const item=currentQ();
  if(answered) return;
  const inputs=[...document.querySelectorAll('input[data-fill]')];
  const st = states[item.id] || {answered:false, correct:false, values:Array(item.sentences.length).fill(''), locked:Array(item.sentences.length).fill(false)};
  st.values = st.values || Array(item.sentences.length).fill('');
  st.locked = st.locked || Array(item.sentences.length).fill(false);
  let allLocked=true;
  let allFilled=true;
  inputs.forEach(inp=>{
    const idx=+inp.dataset.fill;
    if(st.locked[idx]){ inp.disabled=true; inp.classList.add('correct'); return; }
    st.values[idx]=inp.value;
    const s=item.sentences[idx];
    const ok=s.answers.some(a=>norm(a)===norm(inp.value));
    if(ok){
      st.locked[idx]=true;
      inp.classList.add('correct');
      inp.disabled=true;
    } else {
      inp.classList.remove('correct');
    }
    if(!st.locked[idx]) allLocked=false;
    if(!inp.value.trim()) allFilled=false;
  });
  states[item.id]=st;
  saveActiveAttempt();
  if(st.locked.every(Boolean)){
    answered=true;
    mark(true,{values:st.values.slice(), locked:st.locked.slice()});
    feedback('Correct. '+item.explanation,'good');
  } else if(allFilled){
    feedback('Keep going. Correct blanks lock green immediately; remaining blanks still need revision.','info');
  }
}

function renderSelectMatch_HTML(item) {
  const st=states[item.id];
  const optionOrder = st?.optionOrder || shuffle(item.pairs.map((_,i)=>i));
  item._matchOptions = optionOrder;
  return `<div class="dd-hint">🌿 Choose the correct definition from each dropdown. When every row has a choice, press Check answers.</div><div class="select-match">${item.pairs.map((p,i)=>`<div class="select-row" data-row="${i}"><div class="select-term">${escapeHTML(p.left)}</div><select data-match="${i}"><option value="">Choose the best match...</option>${optionOrder.map(idx=>`<option value="${idx}">${escapeHTML(item.pairs[idx].right)}</option>`).join('')}</select></div>`).join('')}</div><div class="select-actions"><button class="btn" onclick="checkSelectMatch()" ${st?.answered?'disabled':''}>Check answers</button><button class="btn ghost" onclick="showAnswer()" ${st?.answered?'disabled':''}>Show answer</button></div><p class="small">No dragging now: term on the left, definition dropdown on the right. Tiny exam dojo, less finger acrobatics 🥢.</p>`;
}
function attachSelectMatch(item) {
  const st=states[item.id];
  const selects=[...document.querySelectorAll('select[data-match]')];
  if(st?.answered){
    selects.forEach(sel=>{
      const termIndex=+sel.dataset.match;
      sel.value=String(st.values?.[termIndex] ?? (st.revealed ? termIndex : ''));
      sel.disabled=true;
      const ok=st.rowResults?.[termIndex] ?? (st.revealed ? true : false);
      sel.closest('.select-row').classList.add(ok?'correct':'wrong');
    });
    return;
  }
  selects.forEach(sel=>{
    sel.addEventListener('change',()=>{
      if(answered) return;
      const allChosen=[...document.querySelectorAll('select[data-match]')].every(s=>s.value!=='');
      if(allChosen) feedback('All rows have choices. Press Check answers to grade this set.','info');
    });
  });
}
function checkSelectMatch() {
  const item=currentQ();
  if(answered || item.type!=='matching') return;
  const selects=[...document.querySelectorAll('select[data-match]')];
  const allChosen=selects.every(s=>s.value!=='');
  if(!allChosen){ feedback('Choose one definition for every term first.','info'); return; }
  let allCorrect=true;
  const values=[];
  const rowResults=[];
  selects.forEach(sel=>{
    const row=sel.closest('.select-row');
    const termIndex=+sel.dataset.match;
    const chosenIndex=+sel.value;
    const ok=termIndex===chosenIndex;
    values[termIndex]=chosenIndex;
    rowResults[termIndex]=ok;
    row.classList.add(ok?'correct':'wrong');
    if(!ok) allCorrect=false;
    sel.disabled=true;
  });
  answered=true;
  mark(allCorrect,{values, rowResults, optionOrder:item._matchOptions.slice()});
  feedback((allCorrect?'Correct. ':'Not quite. ')+item.explanation, allCorrect?'good':'bad');
}
function setupDD(item) {
  const st=states[item.id];
  if(st?.ddSetup) return JSON.parse(JSON.stringify(st.ddSetup));
  let cards, slots, slotOrder;
  if(item.type==='matching'){
    cards=item.pairs.map((p,i)=>({id:'c'+i,text:p.right,correctSlot:'s'+i})); slots=item.pairs.map((p,i)=>({id:'s'+i,label:p.left,multi:false})); slotOrder=shuffle(slots.map(s=>s.id));
  } else {
    cards=item.items.map((t,i)=>({id:'c'+i,text:t,correctSlot:'s'+i})); slots=item.items.map((_,i)=>({id:'s'+i,label:String(i+1),multi:false})); slotOrder=slots.map(s=>s.id);
  }
  return {cards,slots,slotOrder,cardOrder:shuffle(cards.map(c=>c.id)),type:item.type};
}
function renderDD_HTML(item) { currentDD=setupDD(item); const st=states[item.id]; if(st?.placements) dragState.placements={...st.placements}; const hint=item.type==='matching'?'Tap a card, then tap its matching slot. Tap a placed card to return it.':'Tap a card, then tap the correct numbered step. Tap a placed card to return it.'; return `<div class="dd-hint">🌿 ${hint}</div><div id="ddArea"></div>`; }
function attachDD(item) { renderDDArea(item); const st=states[item.id]; if(st?.answered){ renderDDFeedback(st.rowResults || {}); document.querySelectorAll('.dd-card').forEach(card=>card.disabled=true); } }
function renderDDArea(item) { const area=document.getElementById('ddArea'); let h=''; if(currentDD.type==='matching') h+=renderMatchSlots(); else h+=renderOrderSlots(); const inBank=currentDD.cardOrder.filter(cid=>!dragState.placements[cid]); h+=`<div class="card-bank"><div class="card-bank-label">Cards (${inBank.length} left)</div><div class="card-bank-cards">${inBank.length?inBank.map(cid=>{const c=currentDD.cards.find(x=>x.id===cid); const sel=dragState.selected===cid?' selected':''; return `<button class="dd-card${sel}" data-card="${cid}">${escapeHTML(c.text)}</button>`;}).join(''):'<span class="small">All placed.</span>'}</div></div>`; area.innerHTML=h; area.querySelectorAll('.dd-card').forEach(el=>{el.onclick=e=>{e.stopPropagation(); onCardClick(item,el.dataset.card);}}); area.querySelectorAll('[data-slot]').forEach(el=>{el.onclick=()=>onSlotClick(item,el.dataset.slot);}); autoCheckDD(item,false); }
function renderMatchSlots() { return `<div class="match-list">${currentDD.slotOrder.map(sid=>{const slot=currentDD.slots.find(s=>s.id===sid); return `<div class="match-row"><div class="match-label">${escapeHTML(slot.label)}</div>${slotHTML(sid)}</div>`;}).join('')}</div>`; }
function renderOrderSlots() { return `<div class="order-list">${currentDD.slotOrder.map(sid=>{const slot=currentDD.slots.find(s=>s.id===sid); return `<div class="order-row"><div class="order-num">${slot.label}</div>${slotHTML(sid)}</div>`;}).join('')}</div>`; }
function slotHTML(sid) { const cardId=Object.keys(dragState.placements).find(cid=>dragState.placements[cid]===sid); if(cardId){const c=currentDD.cards.find(x=>x.id===cardId); return `<div class="slot-target has-card" data-slot="${sid}"><button class="dd-card" data-card="${cardId}">${escapeHTML(c.text)}</button></div>`;} return `<div class="slot-target" data-slot="${sid}"><span class="placeholder">tap to place</span></div>`; }
function onCardClick(item,cardId) { if(answered)return; if(dragState.placements[cardId]){ delete dragState.placements[cardId]; dragState.selected=null; } else { dragState.selected=(dragState.selected===cardId)?null:cardId; } renderDDArea(item); saveActiveAttempt(); }
function onSlotClick(item,slotId) { if(answered||!dragState.selected)return; Object.keys(dragState.placements).forEach(cid=>{if(dragState.placements[cid]===slotId)delete dragState.placements[cid];}); dragState.placements[dragState.selected]=slotId; dragState.selected=null; renderDDArea(item); saveActiveAttempt(); }
function autoCheckDD(item,force) { if(!currentDD||answered)return; const allPlaced=currentDD.cards.every(c=>dragState.placements[c.id]); if(!allPlaced&&!force)return; const results={}; let count=0; currentDD.cards.forEach(c=>{const ok=dragState.placements[c.id]===c.correctSlot; results[c.id]=ok; if(ok)count++;}); const all=count===currentDD.cards.length; if(allPlaced){ answered=true; mark(all,{placements:{...dragState.placements}, rowResults:results, ddSetup:JSON.parse(JSON.stringify(currentDD))}); renderDDFeedback(results); feedback((all?'Correct. ':'Not quite. ')+item.explanation, all?'good':'bad'); } }
function renderDDFeedback(results) { document.querySelectorAll('.slot-target').forEach(slot=>{ const card=slot.querySelector('.dd-card'); if(card){ const ok=!!results[card.dataset.card]; slot.classList.add(ok?'correct':'wrong'); card.classList.add(ok?'correct':'wrong'); card.disabled=true; } }); }
function mark(ok, data={}) { const item=currentQ(); states[item.id]={...(states[item.id]||{}), answered:true, correct:ok, ...data}; answered=true; document.querySelectorAll('button[onclick="showAnswer()"]').forEach(btn=>{ btn.disabled=true; btn.setAttribute('aria-disabled','true'); }); score=Object.values(states).filter(s=>s.answered&&s.correct).length; elScore.textContent=score; renderJump(); saveActiveAttempt(); }
function feedback(msg,type) { const f=document.getElementById('fb'); f.className='feedback '+type; f.textContent=msg; }
function showAnswer() {
  const item=currentQ();
  if(answered) return;
  if(item.type==='mcq'){
    document.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true; if(item.options[item._shuf[k]].correct)b.classList.add('reveal'); });
    mark(false,{revealed:true, optionOrder:item._shuf.slice()});
  } else if(item.type==='fill'){
    const values=[];
    document.querySelectorAll('input[data-fill]').forEach(inp=>{ const s=item.sentences[+inp.dataset.fill]; inp.value=s.answers[0]; values[+inp.dataset.fill]=inp.value; inp.classList.add('correct'); inp.disabled=true; });
    mark(false,{revealed:true, values});
  } else if(item.type==='matching'){
    const values=[]; const rowResults=[];
    document.querySelectorAll('select[data-match]').forEach(sel=>{ const idx=+sel.dataset.match; sel.value=String(idx); values[idx]=idx; rowResults[idx]=true; sel.disabled=true; sel.closest('.select-row').classList.add('correct'); });
    mark(false,{revealed:true, values, rowResults, optionOrder:item._matchOptions.slice()});
  } else {
    currentDD.cards.forEach(c=>dragState.placements[c.id]=c.correctSlot);
    const results={}; currentDD.cards.forEach(c=>results[c.id]=true);
    renderDDArea(item);
    document.querySelectorAll('.slot-target').forEach(slot=>slot.classList.add('correct'));
    document.querySelectorAll('.dd-card').forEach(card=>{card.classList.add('correct'); card.disabled=true;});
    mark(false,{revealed:true, placements:{...dragState.placements}, rowResults:results, ddSetup:JSON.parse(JSON.stringify(currentDD))});
  }
  answered=true;
  feedback('Answer shown. This question is now locked for this attempt. '+item.explanation,'info');
}
function prevQ() { pos=(pos-1+order.length)%order.length; saveActiveAttempt(); renderQuestion(); }
function nextQ() { pos=(pos+1)%order.length; saveActiveAttempt(); renderQuestion(); }
function showSubmittingScreen() {
  setQuizChrome(false);
  elCard.innerHTML = `<div class="loading-screen"><div class="loading-panel"><div class="wait-orb"><div class="wait-ring ring-a"></div><div class="wait-ring ring-b"></div><div class="wait-core"></div><div class="wait-dot"></div></div><div class="loading-title">Please wait...</div><div class="loading-sub">Submitting your quiz and saving this completion record in the browser.</div><div class="loading-mini">This will take about 5 seconds.</div></div></div>`;
}
function submitAttempt(timeExpired=false) {
  if(attemptSubmitted) return;
  attemptSubmitted=true;
  disableNavigationGuard();
  saveActiveAttempt();
  stopTimer();
  const total=order.length || BANK.length;
  const answeredCount = Object.values(states).filter(s=>s.answered).length;
  const wrongIds = order
    .map(qi => BANK[qi]?.id)
    .filter(id => states[id]?.answered && !states[id]?.correct);
  currentAttemptRecord = {
    submittedAt: new Date().toISOString(),
    score: score,
    total: total,
    answeredCount: answeredCount,
    timeExpired: !!timeExpired,
    remainingSeconds: Math.max(0, remainingSeconds),
    wrongIds: wrongIds
  };
  const best=parseInt(lsGet(STORE_PREFIX+'best')||'0',10);
  if(score>best) lsSet(STORE_PREFIX+'best', String(score));
  const completed = appendAttemptRecord(currentAttemptRecord);
  currentAttemptRecord.completedCount = completed;
  clearActiveAttempt();
  updateSavedStats();
  showSubmittingScreen();
  window.setTimeout(()=>renderResult(false, timeExpired), 5000);
}
function renderResult(recordCompletion=false, timeExpired=false) {
  stopTimer();
  setQuizChrome(false);
  elProg.style.width='100%';
  const attempt = currentAttemptRecord || {
    score: score,
    total: order.length || BANK.length,
    answeredCount: Object.values(states).filter(s=>s.answered).length,
    timeExpired: !!timeExpired,
    remainingSeconds: Math.max(0, remainingSeconds),
    completedCount: getCompleted()
  };
  const total=attempt.total;
  const pct=Math.round((attempt.score/total)*100);
  const completed=attempt.completedCount || getCompleted();
  const resultTitle = attempt.timeExpired ? 'Time is up — attempt submitted' : 'Attempt submitted';
  const timeLine = attempt.timeExpired ? 'The 15-minute timer ended, the quiz was submitted automatically, and the attempt was locked.' : `Time remaining when submitted: <strong>${formatTime(Math.max(0, attempt.remainingSeconds))}</strong>. This attempt has been locked and cannot be edited.`;
  elCard.innerHTML=`<div class="result"><h2>${resultTitle}</h2><div class="score-big">${attempt.score} / ${total}</div><p>${pct}% correct</p><p class="small">${timeLine}</p><p class="small">Answered questions counted: ${attempt.answeredCount} / ${total}. Completed attempts saved in this browser: <strong>${completed}</strong>.</p><p class="small">This locked attempt will appear on the opening page. It will stay here until you press the return button.</p><p class="small">If there are wrong marks, the opening page can generate an incorrect-question-only practice set from this latest attempt.</p><div class="actions" style="justify-content:center"><button class="btn" onclick="showOpening()">Return to opening page</button></div></div>`;
}
bootQuiz();
</script>
